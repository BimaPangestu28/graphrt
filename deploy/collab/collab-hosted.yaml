# Graphrt's hosted service at https://collab.graphrt.com: many teams, open
# sign up with Google, the free plan's quotas (docs/collab.md, "Hosted
# service"). The client id and secret come from the environment: the
# provider is off while its client id variable is empty.
mode: hosted
public_url: https://collab.graphrt.com
listen: 0.0.0.0:8790
data_dir: /data
behind_proxy: true
auth:
  providers:
    - id: google
      name: Google
      issuer: https://accounts.google.com
      client_id_env: GRAPHRT_COLLAB_GOOGLE_CLIENT_ID
      client_secret_env: GRAPHRT_COLLAB_GOOGLE_CLIENT_SECRET
      auth_params: { prompt: select_account }
  # People without Google join with an invite link of a team.
  invite_accounts: true
  access_token_minutes: 10
  refresh_token_days: 30
limits:                                      # the free plan
  workspaces_per_account: 2
  projects_per_workspace: 10
  members_per_workspace: 5
  max_doc_bytes: 2097152
  max_message_bytes: 524288
  sessions_per_account: 5
  messages_per_second: 30
  requests_per_minute: 120
  auto_versions: 30
  version_every_minutes: 10
audit:
  retention_days: 365
