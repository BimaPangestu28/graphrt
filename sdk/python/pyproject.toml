[project]
name = "graphrt-plugin"
version = "0.2.0"
description = "SDK for writing graphrt plugins in Python (standard library only)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = []

[project.urls]
source = "https://github.com/Graphrt/graphrt"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["graphrt_plugin.py"]
