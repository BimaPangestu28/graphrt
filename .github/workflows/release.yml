name: Release

# Push a tag like `v0.1.0` to run the test suite on Linux, macOS and Windows,
# build agent and gateway binaries for every platform (each smoke-tested where
# the runner can execute it), build the mobile SDKs (an Android AAR, an
# XCFramework and a Swift package), publish a GitHub Release with SHA256SUMS,
# push multi-arch agent and gateway images to GHCR and (optionally) publish
# crates to crates.io, the web packages to npm and the AAR to Maven Central.
# Nothing is published unless the tests pass.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BIN: graphrt
  # Build profile for release binaries (see [profile.min-size] in Cargo.toml).
  PROFILE: min-size
  # Opt-in features the released binaries and image add to the CLI defaults:
  # evaluation, and agent skills and self learning (docs/skills.md,
  # docs/learning.md). The slim agent builds of bench/budgets.toml are built
  # with their own feature lists and stay without them.
  EXTRA_FEATURES: eval,online-eval,skills,learning
  # The gateway build (`graphrt-gateway-<target>` archives, `:<version>-gateway`
  # image): the same binary plus `graphrt gateway` / `graphrt deploy` with every
  # provider. Separate so the agent binary stays without mimalloc (decision 10).
  GATEWAY_FEATURES: gateway-all,eval,online-eval,skills,learning
  # Opt-in usage telemetry endpoint compiled into release binaries (docs/telemetry.md).
  # Telemetry stays off until a user runs `graphrt telemetry enable`.
  GRAPHRT_TELEMETRY_URL: https://graphrt-telemetry.bimapangestu280.workers.dev/v1/report

jobs:
  # A dispatched run names its tag as free text; resolve it once, refuse
  # anything but an existing `v*` tag, and hand every job `refs/tags/<tag>` so
  # a branch with the same name can never be built and published instead.
  tag:
    name: resolve the release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Require an existing v* tag
        id: resolve
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::release tag must look like v1.2.3, got '$TAG'"; exit 1 ;;
          esac
          case "$TAG" in
            *[!0-9A-Za-z.+-]*) echo "::error::release tag '$TAG' has characters a version tag cannot have"; exit 1 ;;
          esac
          gh api "repos/$REPO/git/ref/tags/$TAG" --silent || { echo "::error::$TAG is not a tag of $REPO"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"

  test:
    name: test
    needs: tag
    uses: ./.github/workflows/cross-platform.yml
    with:
      linux: true
      ref: ${{ needs.tag.outputs.ref }}

  build:
    name: build ${{ matrix.target }}
    needs: [tag, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # Link the C runtime statically: the .exe then runs without the Visual C++
      # redistributable (no VCRUNTIME140.dll).
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    strategy:
      fail-fast: false
      matrix:
        # `smoke`: the runner can execute the binary, so the packaged build runs a workflow.
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, zig: true, smoke: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, zig: true, smoke: true }
          - { os: macos-latest, target: aarch64-apple-darwin, zig: false, smoke: true }
          - { os: macos-latest, target: x86_64-apple-darwin, zig: false, smoke: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, zig: false, smoke: true }
    steps:
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Install zig + cargo-zigbuild (static musl builds, C deps such as QuickJS)
        if: matrix.zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        # Pinned: without a version setup-zig resolves `latest` with one unretried
        # fetch of ziglang.org's index.json, a single point of failure.
        with:
          version: 0.17.1
      - if: matrix.zig
        # Pinned: it runs in the job that produces the release binaries.
        run: cargo install cargo-zigbuild --version 0.24.1 --locked
      - name: Build and package (agent and gateway)
        id: package
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          case "${{ matrix.target }}" in *windows*) ext=".exe" ;; esac
          mkdir -p dist
          # archive-prefix:features (the agent first, then the gateway build).
          specs=("${BIN}:$EXTRA_FEATURES" "${BIN}-gateway:$GATEWAY_FEATURES")
          for spec in "${specs[@]}"; do
            prefix=${spec%%:*}
            features=${spec#*:}
            if [ "${{ matrix.zig }}" = "true" ]; then
              cargo zigbuild -p graphrt-cli --locked --profile "$PROFILE" --features "$features" --target "${{ matrix.target }}"
            else
              cargo build -p graphrt-cli --locked --profile "$PROFILE" --features "$features" --target "${{ matrix.target }}"
            fi
            name="${prefix}-${{ matrix.target }}"
            mkdir -p "dist/$name"
            cp "target/${{ matrix.target }}/${PROFILE}/${BIN}${ext}" "dist/$name/"
            cp LICENSE README.md CHANGELOG.md "dist/$name/"
            (
              cd dist
              case "${{ matrix.target }}" in
                *windows*) 7z a "$name.zip" "$name" >/dev/null ;;
                *) tar -czf "$name.tar.gz" "$name" ;;
              esac
            )
          done
          echo "agent=dist/${BIN}-${{ matrix.target }}/${BIN}${ext}" >> "$GITHUB_OUTPUT"
          echo "gateway=dist/${BIN}-gateway-${{ matrix.target }}/${BIN}${ext}" >> "$GITHUB_OUTPUT"
      - name: Smoke test the packaged binaries
        if: matrix.smoke
        shell: bash
        run: |
          sh scripts/smoke-release-binary.sh "${{ steps.package.outputs.agent }}"
          if [ -n "${{ steps.package.outputs.gateway }}" ]; then
            SMOKE_REQUIRED_FEATURES="eval online-eval skills learning deploy-fly gateway" sh scripts/smoke-release-binary.sh "${{ steps.package.outputs.gateway }}"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  # The Android SDK: libgraphrt_ffi.so for arm64-v8a, armeabi-v7a and x86_64
  # with the `sdk` features, the Kotlin binding and helpers, as an AAR and as a
  # Maven repository layout (POM, sources, checksums) for Maven Central.
  android-sdk:
    name: Android SDK (AAR)
    needs: [tag, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-ndk
      - name: Build libgraphrt_ffi.so (arm64-v8a, armeabi-v7a, x86_64)
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" sdk/android/scripts/build-native.sh
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build the AAR and the Maven layout
        working-directory: sdk/android
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          ./gradlew --no-daemon -PgraphrtVersion="${TAG#v}" :graphrt:assembleRelease :graphrt:publishReleasePublicationToStagingRepository
          mkdir -p ../../dist
          cp graphrt/build/outputs/aar/graphrt-release.aar "../../dist/graphrt-android-${TAG#v}.aar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-sdk
          path: dist/*.aar
          if-no-files-found: error
      # Not a release asset: what the Maven Central job signs and uploads.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-native-libraries
          path: sdk/android/graphrt/src/main/jniLibs
          if-no-files-found: error
          retention-days: 7

  # The iOS and macOS SDK: GraphrtFFI.xcframework (iOS device, iOS simulator
  # arm64 + x86_64, macOS arm64 + x86_64) and a Swift package that points at it.
  swift-sdk:
    name: Swift SDK (XCFramework + Swift package)
    needs: [tag, test]
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build GraphrtFFI.xcframework
        run: sdk/swift/scripts/build-xcframework.sh
      - name: Test the Swift package against it
        working-directory: sdk/swift
        run: swift test
      - name: Package for the release
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: sdk/swift/scripts/package-release.sh "$TAG" "$REPO" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-sdk
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [tag, build, android-sdk, swift-sdk]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          # The Android libraries (directories per ABI) are for the Maven Central job, not assets.
          find dist -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
          cd dist
          sha256sum -- * > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
      # Title "Graphrt X.Y.Z", body from CHANGELOG.md plus .github/release-notes/install.md.
      - name: Release notes
        id: notes
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          scripts/release-notes.sh "$TAG" > release-notes.md
          cat release-notes.md
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          name: Graphrt ${{ steps.notes.outputs.version }}
          body_path: release-notes.md
          files: |
            dist/*
            install.sh

  docker:
    name: Container image (GHCR, ${{ matrix.flavor }})
    needs: [tag, test]
    runs-on: ubuntu-latest
    # Both architectures build in one job, arm64 under QEMU.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        # `agent`: ghcr.io/<owner>/graphrt:<version>, <major.minor>, latest.
        # `gateway`: the same tags with a `-gateway` suffix, plus `gateway`.
        flavor: [agent, gateway]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.ref }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/graphrt
          flavor: |
            latest=false
            suffix=${{ matrix.flavor == 'gateway' && '-gateway' || '' }},onlatest=true
          tags: |
            type=semver,pattern={{version}},value=${{ needs.tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.tag.outputs.tag }}
            type=raw,value=latest,enable=${{ matrix.flavor == 'agent' }}
            type=raw,value=gateway,suffix=,enable=${{ matrix.flavor == 'gateway' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GRAPHRT_TELEMETRY_URL=${{ env.GRAPHRT_TELEMETRY_URL }}
            EXTRA_FEATURES=${{ matrix.flavor == 'gateway' && env.GATEWAY_FEATURES || env.EXTRA_FEATURES }}
          cache-from: type=gha,scope=${{ matrix.flavor }}
          cache-to: type=gha,mode=max,scope=${{ matrix.flavor }}

  crates-io:
    name: Publish to crates.io
    needs: [tag, release]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Opt-in: set repository variable PUBLISH_CRATES=true and secret CARGO_REGISTRY_TOKEN.
    if: ${{ vars.PUBLISH_CRATES == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish.sh --execute --delay 30

  npm:
    name: Publish web packages to npm
    needs: [tag, release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Opt-in: set repository variable PUBLISH_NPM=true once the @graphrt packages
    # on npmjs.com name this workflow (release.yml, environment npm) as their
    # trusted publisher. There is no token: npm takes the job's OIDC identity,
    # and attaches a provenance statement to every version. See docs/web.md.
    if: ${{ vars.PUBLISH_NPM == 'true' }}
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted publishing needs Node.js 22.14+ and npm 11.5.1+.
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Require an npm that can publish with OIDC
        run: |
          version="$(npm --version)"
          echo "npm $version"
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$version" \
            || { echo "::error::npm $version is older than 11.5.1"; exit 1; }
      - run: npm ci
        working-directory: web
      # Builds each package, checks what would be uploaded, and publishes the
      # versions that are not on npm yet. A release that did not change a
      # package's version leaves that package alone.
      - run: node scripts/publish.mjs --execute
        working-directory: web

  # Opt-in, and off until the owner has set it up (see docs/mobile.md#publishing):
  # repository variable PUBLISH_MAVEN=true, secrets MAVEN_CENTRAL_USERNAME and
  # MAVEN_CENTRAL_PASSWORD (a Central Portal user token), SIGNING_KEY (an
  # ASCII-armored PGP private key whose public key is on a key server) and
  # SIGNING_PASSWORD, and the namespace com.graphrt verified on the Central
  # Portal (a DNS TXT record on graphrt.com). The upload is USER_MANAGED: it
  # waits in the Central Portal until someone presses Publish.
  maven-central:
    name: Publish the Android SDK to Maven Central
    needs: [tag, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: ${{ vars.PUBLISH_MAVEN == 'true' }}
    environment: maven-central
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-native-libraries
          path: sdk/android/graphrt/src/main/jniLibs
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Sign into a Maven layout
        working-directory: sdk/android
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon -PgraphrtVersion="${TAG#v}" :graphrt:publishReleasePublicationToStagingRepository
      - name: Upload the bundle to the Central Portal
        working-directory: sdk/android/graphrt/build/staging-repo
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          version="${TAG#v}"
          files="$(find . -path "*/graphrt-android/$version/*" -type f)"
          echo "$files" | grep -q '\.aar\.asc$' || { echo "::error::the AAR is not signed"; exit 1; }
          echo "$files" | zip -q bundle.zip -@
          token="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w0)"
          curl --fail-with-body -sS -H "Authorization: Bearer $token" \
            -F "bundle=@bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=graphrt-android-$version&publishingType=USER_MANAGED"
