name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests a pull request on top of main and of the ones queued before it.
  merge_group:
  workflow_dispatch:

# Read-only token: no job here writes to the repository.
permissions:
  contents: read

# A new push to a pull request cancels the run of its previous push. Every other run
# (main, merge queue, manual) gets a group of its own, so it is never cancelled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # What the pull request changes (.github/path-filters.yml), also when the merge
  # queue tests it. The jobs that build release-like binaries skip a pull request
  # that changes only prose, and they show as skipped. Every other event reports
  # `code: true`.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ !(github.event_name == 'pull_request' || github.event_name == 'merge_group') || steps.filter.outputs.code == 'true' }}
    steps:
      - if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Empty token: changes come from git diff, no pull-requests permission needed.
          token: ""
          filters: .github/path-filters.yml
          predicate-quantifier: some-with-excludes

  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace --all-features

  release-notes:
    name: release notes script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/test-release-notes.sh
      - run: scripts/test-changelog.sh

  # The Kotlin and Swift examples of docs/mobile.md are regions of the SDK test
  # sources, which the `sdk` job of mobile.yml compiles and runs. Here only: they
  # are still the same text (also when only the guide changed).
  doc-snippets:
    name: mobile guide snippets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check-doc-snippets.py

  msrv:
    name: MSRV (1.89, every crate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `local-embed` (default in graphrt-cli) builds candle-core, which needs Rust 1.94+:
      # every crate is checked on 1.89, graphrt-cli with its default features minus `local-embed`,
      # plus `skills`, `learning` and `console`, which the release builds add.
      - run: cargo check --workspace --exclude graphrt-cli
      - run: >-
          cargo check -p graphrt-cli --no-default-features --features
          llm,http,code,python,mcp,doc,files,image,rag,connectors,plugins,wasm,otel,bundle,serve,trust-gateway,jwt,telemetry,scores,langfuse,deploy-fly,cors,run-follow,conversations,web-chat,devices,approvals,web-push,web-monitor,skills,learning,channel-telegram,channel-whatsapp,channel-slack,channel-teams,context,console
      # The `:<version>-collab` image: the collaboration server alone.
      - run: cargo check -p graphrt-cli --no-default-features --features collab

  minimal-core:
    name: core without default features
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test -p graphrt-core --no-default-features
      # The model nodes as the slim builds have them: without the context guard, skills and
      # learning, where a document that asks for one of them must be refused.
      - run: cargo test -p graphrt-llm --lib

  minimal-gateway:
    name: gateway without default features
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `gateway --dev` starts agents of the same binary: the smallest gateway build must serve them.
      - run: cargo test -p graphrt-cli --no-default-features --features gateway --test gateway_dev
      # The collaboration image is built with `collab` alone: it must serve, sign in and speak TLS.
      - run: cargo test -p graphrt-cli --no-default-features --features collab --test collab_cli

  wasm:
    name: core on wasm32
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build -p graphrt-core --no-default-features --features yaml,jinja --target wasm32-unknown-unknown

  size:
    name: binary size
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build -p graphrt-cli --profile min-size
      - name: Report binary size
        run: |
          ls -l target/min-size/graphrt
          echo "### graphrt binary: $(du -h target/min-size/graphrt | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

  budgets:
    name: budgets (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Size, idle RSS and start-up budgets of Linux musl builds (bench/budgets.toml),
    # plus a SIGTERM drain of graphrt running as PID 1 (scripts/test-pid1.sh).
    #
    # A pull request and the merge queue check x86_64 only. The aarch64 entry takes
    # 4 to 6 minutes, so it runs on pushes to main and on manual runs: an aarch64
    # budget that a pull request breaks shows on main after the merge. On a pull
    # request the entry is left out of the matrix (not skipped), so `ci-ok` sees
    # one `budgets` result either way.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'merge_group')
          && '[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-musl"}]'
          || '[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-musl"},{"os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-musl"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: budgets-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install zig + cargo-zigbuild
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        # Pinned: without a version setup-zig resolves `latest` with one unretried
        # fetch of ziglang.org's index.json, a single point of failure.
        with:
          version: 0.17.1
      - run: cargo install cargo-zigbuild --locked
      - name: Check budgets
        run: |
          mkdir -p budget-bins
          python3 scripts/budget-gate.py --target ${{ matrix.target }} --build-cmd "cargo zigbuild" \
            --keep-bins budget-bins --json budgets-${{ matrix.target }}.json
      - name: SIGTERM drain as PID 1
        run: sudo scripts/test-pid1.sh budget-bins/graphrt-agent-slim
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: budgets-${{ matrix.target }}
          path: budgets-${{ matrix.target }}.json

  chatbot-e2e:
    name: chatbot security e2e (PostgREST + Postgres)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      POSTGREST_VERSION: v16.6
      # sha256 of postgrest-v16.6-linux-static-x86-64.tar.xz (the digest GitHub
      # lists for the release asset); update it together with the version.
      POSTGREST_SHA256: 335ea29f00145705fb569b1268b9c8e53d062f8f6f9188192e92ea3781d2dca1
      # ubuntu-24.04 images ship PostgreSQL 16 (service stopped; the test starts its own cluster).
      PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install PostgREST
        # Verified before it is unpacked into /usr/local/bin as root.
        run: |
          archive="postgrest-${POSTGREST_VERSION}-linux-static-x86-64.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/PostgREST/postgrest/releases/download/${POSTGREST_VERSION}/${archive}"
          echo "${POSTGREST_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          sudo tar -xJf "$RUNNER_TEMP/$archive" -C /usr/local/bin postgrest
          postgrest --version
      # The features of the chatbot container image.
      - run: cargo build -p graphrt-cli --no-default-features --features llm,serve,jwt,plugins
      - run: examples/supabase-chatbot/tests/run.sh target/debug/graphrt

  web:
    name: npm package graphrt (client, UI blocks, chat, monitor) against graphrt serve
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The tests start this binary: the client, the chat and the widget run
      # against a real server, not a mock.
      - run: cargo build -p graphrt-cli
      - run: npm ci
        working-directory: web
      # Types, lint, tests, that crates/graphrt-cli/assets is what the sources
      # build (the pages `graphrt serve --chat` and `--monitor` embed), and that
      # the package builds, packs, loads and tree shakes as it is published.
      - run: npm run check
        working-directory: web

  # The one check a ruleset requires for this workflow: its name never changes when
  # a job or a matrix entry is added, renamed or removed. It passes when every job
  # it needs succeeded or was skipped (by the `changes` job), and fails when one
  # failed or was cancelled.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, check, release-notes, doc-snippets, msrv, minimal-core, minimal-gateway, wasm, size, budgets, chatbot-e2e, web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every needed job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
