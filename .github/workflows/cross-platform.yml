name: Cross-platform tests

# The workspace test suite on Windows and macOS (Linux runs in ci.yml).
# The release workflow calls this with `linux: true`, so every tagged binary is
# built only after the tests passed on the OS it targets.
#
# No workflow level path filter: a pull request that changes only prose still gets
# these checks, reported as skipped by the `changes` job (.github/path-filters.yml).
# Pushes to main and the release workflow always run the full matrix.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      linux:
        description: "Also test on ubuntu-latest"
        type: boolean
        default: false
      ref:
        description: "Git ref to test (default: the triggering ref)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels the run of its previous push. Every other run
  # (main, manual, called from the release workflow) gets a group of its own, so it is
  # never cancelled or replaced.
  group: cross-platform-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # No incremental artifacts: smaller caches, faster restores on CI.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  # What the pull request changes. Git diff instead of the API: no pull-requests
  # permission, which the release workflow does not grant to the jobs it calls.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          token: ""
          filters: .github/path-filters.yml
          predicate-quantifier: some-with-excludes

  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    # Windows takes about 10 minutes with a warm cache and 25 without one.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Pull requests test macOS on Intel (macos-15-intel): the arm64 pool is short
        # of capacity and left PR jobs queued for an hour. main, manual runs and the
        # release workflow keep arm64 (macos-latest).
        os: ${{ fromJSON(format('[{0}"{1}","windows-latest"]', inputs.linux && '"ubuntu-latest",' || '', github.event_name == 'pull_request' && 'macos-15-intel' || 'macos-latest')) }}
    steps:
      # Fixtures are hashed (plugin checksums, bundles) and compared byte for
      # byte: keep LF line endings on Windows checkouts.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # One cache per OS (rust-cache adds the runner OS to the key). GitHub
          # scopes caches by ref: PR and tag (release) runs can restore main's
          # cache, but what they save stays with their own ref, so only main
          # runs refresh the cache the others start from.
          shared-key: cross-platform
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Plugin and code-node tests start `python3`; Windows images only ship `python.exe`.
      - name: Provide python3 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Ignore the WindowsApps store aliases: they are stubs, not interpreters.
          function Find-Real($name) {
            Get-Command $name -All -CommandType Application -ErrorAction SilentlyContinue |
              Where-Object { $_.Source -notlike '*WindowsApps*' } | Select-Object -First 1
          }
          if (-not (Find-Real python3)) {
            $python = Find-Real python
            if (-not $python) { throw 'no python.exe on PATH' }
            Copy-Item $python.Source (Join-Path (Split-Path $python.Source) 'python3.exe')
          }
          python3 --version
          node --version
      # Every failing test binary is reported, not only the first one.
      - run: cargo test --workspace --all-features --locked --no-fail-fast
