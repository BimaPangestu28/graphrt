name: Mobile

# Builds graphrt-ffi for Android and iOS with the SDK's features, builds the
# sample apps in examples/mobile and runs the offline hello workflow and the
# phone assistant (examples/mobile/agent.yaml: a scripted model, native tools
# through the host callback, a pause for approval, the resume and the streamed
# answer) through the Kotlin SDK in an Android emulator and through the Swift
# SDK in an iOS simulator (examples/mobile/*/scripts/smoke-test.sh). The `sdk`
# job checks that the bindings match the API and runs the Kotlin and Swift
# tests, docs/mobile.md snippets included, on Linux. The same scripts run
# locally; see docs/mobile.md#testing-on-devices for physical devices.
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "bindings/**"
      - "sdk/android/**"
      - "sdk/swift/**"
      - "scripts/generate-bindings.sh"
      - "scripts/check-doc-snippets.py"
      - "examples/hello.yaml"
      - "examples/mobile/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mobile.yml"
  # No workflow level path filter: the `changes` job skips the Android and iOS
  # jobs of a pull request that does not touch what they build, and they report
  # as skipped (`mobile` in .github/path-filters.yml).
  pull_request:
    # `labeled` and `unlabeled`: the `macos` label takes effect when it is set, not at the next push.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # The merge queue runs what the pull request ran (`merge_group` takes no path filter).
  merge_group:
  schedule:
    # Every night (02:47 UTC), so an iOS failure is seen within a day.
    - cron: "47 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run of its previous push. Every other run
# (main, merge queue, nightly, manual) gets a group of its own, so it is never cancelled or replaced.
concurrency:
  group: mobile-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mobile: ${{ !(github.event_name == 'pull_request' || github.event_name == 'merge_group') || steps.filter.outputs.mobile == 'true' }}
    steps:
      - if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Empty token: changes come from git diff, no pull-requests permission needed.
          token: ""
          filters: .github/path-filters.yml
          predicate-quantifier: some-with-excludes

  sdk:
    name: SDK (bindings, Kotlin and Swift tests on Linux)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: sdk
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: The bindings match the API
        run: scripts/generate-bindings.sh --check
      - name: The guide's snippets are the tested code
        run: python3 scripts/check-doc-snippets.py
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Kotlin tests and snippets on the JVM
        run: sdk/android/scripts/test-jvm.sh
      - name: Swift tests and snippets on Linux
        # The swift image matches the runner (Ubuntu 24.04), so the host library loads in it.
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:$PWD" -w "$PWD/sdk/swift" -e LD_LIBRARY_PATH="$PWD/target/debug" \
            swift:6.1-noble swift test --scratch-path /tmp/swift-build -Xlinker -L"$PWD/target/debug"

  android:
    name: Android (arm64-v8a + x86_64, emulator smoke test)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # x86_64 system image: the only one with KVM acceleration on GitHub's Linux runners.
      EMULATOR_API_LEVEL: 34
      EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-ndk
      - name: Build libgraphrt_ffi.so with the SDK's features (aarch64-linux-android, x86_64-linux-android)
        # The runner image ships the NDK; use its newest one (r27+). The armeabi-v7a
        # library of the release AAR is checked here, not built.
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" examples/mobile/android/scripts/build-rust.sh
      - name: Check armv7-linux-androideabi
        run: |
          rustup target add armv7-linux-androideabi
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" cargo ndk -t armeabi-v7a check -p graphrt-ffi --lib --features sdk

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build the sample APK (with the SDK module sdk/android/graphrt)
        working-directory: examples/mobile/android
        run: ./gradlew assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache the AVD
        id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.EMULATOR_API_LEVEL }}-x86_64
      - name: Create the AVD and a boot snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "AVD snapshot created"
      - name: Smoke test in the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: examples/mobile/android/scripts/smoke-test.sh

  ios:
    name: iOS (device + simulator, simulator smoke test)
    needs: changes
    # Optional for a pull request: macOS runners are slow to start and made every
    # pull request wait. It runs on pushes to main, every night, on manual runs and
    # on a pull request with the `macos` label (set it when the change touches the
    # Swift binding or the iOS sample). It never runs in the merge queue and
    # `mobile-ok` does not need it: an iOS failure on main shows as a failed run
    # there and does not block a merge.
    if: >-
      needs.changes.outputs.mobile == 'true' && github.event_name != 'merge_group' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'macos'))
    # A labelled pull request runs on Intel (macos-15-intel): the arm64 pool is
    # short of capacity and left PR jobs queued for an hour. The simulator then runs
    # x86_64, so the xcframework gets an x86_64 simulator slice and the app is built
    # for x86_64. main, nightly and manual runs keep arm64 (macos-15).
    runs-on: ${{ github.event_name == 'pull_request' && 'macos-15-intel' || 'macos-15' }}
    # The SDK's features for three Apple targets plus the macOS slice of the Swift tests.
    timeout-minutes: 75
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
      # Simulator architecture of the runner, its Rust target, and the other simulator target (checked only).
      SIMULATOR_ARCH: ${{ github.event_name == 'pull_request' && 'x86_64' || 'arm64' }}
      SIMULATOR_TARGET: ${{ github.event_name == 'pull_request' && 'x86_64-apple-ios' || 'aarch64-apple-ios-sim' }}
      OTHER_SIMULATOR_TARGET: ${{ github.event_name == 'pull_request' && 'aarch64-apple-ios-sim' || 'x86_64-apple-ios' }}
      # Pinned so the app builds with the SDK of the runtime it runs on. Picking the
      # newest installed runtime ran iOS 26 under the default Xcode 16.4, whose
      # first boot left SpringBoard unable to launch apps for minutes.
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-18-5
      SIMULATOR_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-16
      DIAGNOSTICS_DIR: ${{ github.workspace }}/simulator-diagnostics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ios
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build GraphrtFFI.xcframework (aarch64-apple-ios + ${{ env.SIMULATOR_TARGET }})
        run: GRAPHRT_TARGETS="aarch64-apple-ios $SIMULATOR_TARGET" examples/mobile/ios/scripts/build-xcframework.sh
      - name: Check the other simulator target (${{ env.OTHER_SIMULATOR_TARGET }})
        run: |
          rustup target add "$OTHER_SIMULATOR_TARGET"
          LIBCLANG_PATH="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" \
            cargo check -p graphrt-ffi --lib --features sdk --target "$OTHER_SIMULATOR_TARGET"
      - name: Swift package tests and snippets on macOS
        # A macOS slice of the runner's architecture is enough for `swift test`.
        run: |
          GRAPHRT_TARGETS="$(uname -m | sed 's/arm64/aarch64/')-apple-darwin" sdk/swift/scripts/build-xcframework.sh
          cd sdk/swift && swift test

      - name: Build the sample app for the simulator
        working-directory: examples/mobile/ios
        run: |
          xcodebuild -project GraphrtSample.xcodeproj -scheme GraphrtSample \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug -derivedDataPath build/DerivedData \
            ARCHS="$SIMULATOR_ARCH" 'EXCLUDED_ARCHS[sdk=iphonesimulator*]=' \
            CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Boot a simulator (iOS 18.5, iPhone 16) and wait until it launches apps
        # Retries a stalled boot on a fresh device. The smoke test is never retried.
        run: examples/mobile/ios/scripts/boot-simulator.sh
      - name: Smoke test in the simulator
        run: examples/mobile/ios/scripts/smoke-test.sh
      - name: Upload the simulator diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-simulator-diagnostics
          path: ${{ env.DIAGNOSTICS_DIR }}
          if-no-files-found: ignore
          retention-days: 14

  # The one check a ruleset requires for this workflow: its name never changes when
  # a job or a matrix entry is added, renamed or removed. It passes when every job
  # it needs succeeded or was skipped (by the `changes` job), and fails when one
  # failed or was cancelled. `ios` is not needed on purpose.
  mobile-ok:
    name: mobile-ok
    if: always()
    needs: [changes, sdk, android]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every needed job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
