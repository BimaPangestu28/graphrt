name: Mobile

# Builds graphrt-ffi for Android and iOS, builds the sample apps in
# examples/mobile and runs the offline hello workflow through the Kotlin
# binding in an Android emulator and through the Swift binding in an iOS
# simulator (examples/mobile/*/scripts/smoke-test.sh). The same scripts run
# locally; see docs/mobile.md#testing-on-devices for physical devices.
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "bindings/kotlin/**"
      - "bindings/swift/**"
      - "examples/hello.yaml"
      - "examples/mobile/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "crates/**"
      - "bindings/kotlin/**"
      - "bindings/swift/**"
      - "examples/hello.yaml"
      - "examples/mobile/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  android:
    name: Android (arm64-v8a + x86_64, emulator smoke test)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # x86_64 system image: the only one with KVM acceleration on GitHub's Linux runners.
      EMULATOR_API_LEVEL: 34
      EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-ndk
      - name: Build libgraphrt_ffi.so (aarch64-linux-android, x86_64-linux-android)
        # The runner image ships the NDK; use its newest one (r27+).
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" examples/mobile/android/scripts/build-rust.sh

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build the sample APK
        working-directory: examples/mobile/android
        run: ./gradlew assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache the AVD
        id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.EMULATOR_API_LEVEL }}-x86_64
      - name: Create the AVD and a boot snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "AVD snapshot created"
      - name: Smoke test in the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: examples/mobile/android/scripts/smoke-test.sh

  ios:
    name: iOS (device + simulator, simulator smoke test)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ios
      - name: Build GraphrtFFI.xcframework (aarch64-apple-ios, aarch64-apple-ios-sim)
        run: examples/mobile/ios/scripts/build-xcframework.sh
      - name: Check the Intel simulator target (x86_64-apple-ios)
        run: cargo check -p graphrt-ffi --lib --no-default-features --target x86_64-apple-ios

      - name: Build the sample app for the simulator
        working-directory: examples/mobile/ios
        run: |
          xcodebuild -project GraphrtSample.xcodeproj -scheme GraphrtSample \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Boot a simulator (newest iOS runtime, first iPhone it supports)
        run: |
          read -r runtime device_type < <(xcrun simctl list runtimes available -j | jq -r \
            '[.runtimes[] | select(.platform == "iOS")] | last
             | [.identifier, ([.supportedDeviceTypes[] | select(.productFamily == "iPhone")] | first | .identifier)]
             | @tsv')
          udid="$(xcrun simctl create graphrt-smoke "$device_type" "$runtime")"
          echo "simulator: $device_type on $runtime ($udid)"
          xcrun simctl bootstatus "$udid" -b
          echo "SIMULATOR_DEVICE=$udid" >> "$GITHUB_ENV"
      - name: Smoke test in the simulator
        run: examples/mobile/ios/scripts/smoke-test.sh
