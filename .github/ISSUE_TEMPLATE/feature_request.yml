name: Feature request
description: Propose a new node, provider, integration or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work? Include a sketch of the workflow config or API if relevant.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Could a plugin (Python, TypeScript, Rust, WASM) or an existing node cover it?
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this.
