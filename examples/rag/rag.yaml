# Retrieval-augmented answering over a local knowledge base.
#   graphrt kb --knowledge examples/rag/knowledge.yaml ingest --dataset handbook examples/rag/docs/*
#   graphrt run examples/rag/rag.yaml --knowledge examples/rag/knowledge.yaml \
#       --model ollama/qwen2.5:14b --input question="How many leave days do I get?"
version: "1"
name: handbook-qa
graph:
  nodes:
    - id: start
      type: start
      variables:
        - { variable: question, type: paragraph, required: true }

    - id: retrieve
      type: knowledge-retrieval
      query_variable_selector: [start, question]
      dataset_ids: [handbook]
      retrieval_mode: multiple
      multiple_retrieval_config: { top_k: 3, score_threshold: 0.3 }

    - id: answer_llm
      type: llm
      model: { provider: openai, name: gpt-4o-mini }
      context: { enabled: true, variable_selector: [retrieve, result] }
      prompt_template:
        - role: system
          text: |
            Answer using only the context below. If the answer is not in the context, say you don't know.
            Context:
            {{#context#}}
        - role: user
          text: "{{#start.question#}}"

    - id: answer
      type: answer
      answer: "{{#answer_llm.text#}}"

  edges:
    - { source: start, target: retrieve }
    - { source: retrieve, target: answer_llm }
    - { source: answer_llm, target: answer }
