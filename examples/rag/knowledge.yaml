# Knowledge base used by examples/rag/rag.yaml.
# Embeddings come from a local Ollama (`ollama pull nomic-embed-text`);
# chunks are stored in a JSON file next to this config.
embedders:
  local:
    type: ollama
    model: nomic-embed-text
stores:
  local:
    type: memory
    path: examples/rag/.store.json
datasets:
  - id: handbook
    name: Company handbook
    store: local
    embedder: local
