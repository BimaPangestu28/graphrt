# yaml-language-server: $schema=https://raw.githubusercontent.com/BimaPangestu28/graphrt/main/schema/workflow-v1.schema.json
# Judge: does the answer address the question that was asked?
#   - { type: judge, workflow: judges/answer-relevance.yaml, metric: relevance,
#       inputs: { question: "{{question}}" } }
version: "1"
name: judge-answer-relevance
description: Pass when the answer addresses the question asked.
graph:
  nodes:
    - id: start
      type: start
      variables:
        - { variable: output, type: paragraph, required: true }
        - { variable: question, type: paragraph, required: true }

    - id: judge
      type: llm
      model: { provider: openai, name: gpt-4o-mini, completion_params: { temperature: 0 } }
      prompt_template:
        - role: system
          text: |
            You are an answer relevance judge. Decide one thing only: does the
            ANSWER address the QUESTION that was asked? Do not judge whether the
            answer is true; an evasive, off-topic or generic answer fails.
            - pass: the answer responds to what the question asks.
            - fail: the answer is about something else, or avoids the question.
            - unknown: the question itself is unintelligible.
            First write your reasoning in one sentence, then the verdict.
        - role: user
          text: |
            QUESTION:
            {{#start.question#}}

            ANSWER:
            {{#start.output#}}
      structured_output:
        schema:
          type: object
          required: [reasoning, verdict]
          additionalProperties: false
          properties:
            reasoning: { type: string }
            verdict: { type: string, enum: [pass, fail, unknown] }

    - id: end
      type: end
      outputs:
        - { variable: verdict, value_selector: [judge, structured_output, verdict] }
        - { variable: reasoning, value_selector: [judge, structured_output, reasoning] }

  edges:
    - { source: start, target: judge }
    - { source: judge, target: end }
