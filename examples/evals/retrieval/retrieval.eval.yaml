# yaml-language-server: $schema=https://raw.githubusercontent.com/BimaPangestu28/graphrt/main/schema/eval-v1.schema.json
# Retrieval quality against labelled documents, fully offline (hash embeddings,
# committed store). Run from the repository root (the store path in
# knowledge.yaml is relative to the working directory):
#   graphrt eval examples/evals/retrieval/retrieval.eval.yaml
description: Policy questions retrieve the right document first.
workflow: retrieve.yaml
knowledge: knowledge.yaml
# {id, vars, metadata: {relevant: [document ids]}} per line.
dataset: questions.jsonl

defaultTest:
  assert:
    # `{{metadata.relevant}}` is the labelled list of each dataset row.
    - { type: retrieval:recall-at-k, value: "{{metadata.relevant}}", k: 1, metric: recall@1 }
    - { type: retrieval:mrr, value: "{{metadata.relevant}}", metric: mrr }
    # Precision is reported only: three hits always come back.
    - { type: retrieval:precision-at-k, value: "{{metadata.relevant}}", k: 3, weight: 0, metric: precision@3 }

gate:
  pass_rate: 1.0
