[package]
name = "graphrt-cli"
description = "The graphrt command-line runner and HTTP server for agentic workflow graphs."
readme = "README.md"
documentation = "https://docs.rs/graphrt-cli"
homepage = "https://github.com/Graphrt/graphrt"
keywords = ["workflow", "agent", "llm", "cli", "runtime"]
categories = ["command-line-utilities", "development-tools"]
version.workspace = true
edition.workspace = true
# `std::fs::File::lock` (run store) needs Rust 1.89; the libraries keep the workspace MSRV.
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "graphrt_cli"
path = "src/lib.rs"

[[bin]]
name = "graphrt"
path = "src/main.rs"

[features]
default = ["llm", "http", "code", "python", "mcp", "doc", "files", "image", "documents", "rag", "connectors", "local-embed", "plugins", "mcp-presets", "wasm", "otel", "bundle", "serve", "trust-gateway", "jwt", "telemetry", "scores", "langfuse", "deploy-fly", "deploy-cloud-run", "deploy-aws", "store-s3", "cors", "run-follow", "conversations", "web-chat", "devices", "approvals", "web-push", "web-monitor", "channel-telegram", "channel-whatsapp", "channel-slack", "channel-teams", "context", "memory", "memory-graph", "subagents"]
# llm, question-classifier, parameter-extractor and agent nodes.
llm = ["dep:graphrt-llm"]
# `context_window` of the `llm` and `agent` nodes: a conversation that outgrows the
# model's context window is trimmed and sent again instead of failing the node. Not in
# the slim builds (`serve,llm,plugins`), whose nodes send every message as before.
context = ["llm", "graphrt-llm/context"]
# `long_term_memory` of the `agent` node: notes per tenant, agent and user in files
# (`$GRAPHRT_MEMORY_DIR`, default `~/.graphrt/memory`), `graphrt memory` and, with
# `serve`, `/v1/memory` for the owner and `/v1/me/memory` for the verified user.
# Not in the slim builds (`serve,llm,plugins`), which refuse a document that asks for it.
memory = ["llm", "graphrt-llm/memory", "dep:graphrt-memory", "dep:sha2"]
# The memory graph: `long_term_memory.graph` reads saved notes into entities and
# relations with periods, recall walks them, `graphrt memory graph build|show`.
memory-graph = ["memory", "graphrt-memory/graph", "graphrt-llm/memory-graph"]
# `subagents` of the `agent` node: served workflows (or `run --workflows DIR`)
# started as child runs of the same run. Not in the slim builds.
subagents = ["llm", "graphrt-llm/subagents", "graphrt-core/subagents"]
# http-request node with SSRF-safe egress.
http = ["dep:graphrt-http", "dep:reqwest"]
# code node (embedded JavaScript).
code = ["dep:graphrt-code"]
# Python code nodes via a local subprocess, enabled per run with `--allow-python-subprocess`.
python = ["code", "graphrt-code/python"]
# document-extractor node (PDF, Office, spreadsheets, HTML, EPUB, email...).
doc = ["dep:graphrt-doc", "graphrt-files?/doc"]
# File workspaces for agents (`--workspace`): the `files` tools, sandboxed to one
# directory with quotas. With `doc`, `files/read` also extracts document text.
files = ["dep:graphrt-files", "dep:thiserror", "graphrt-core/tool-files", "graphrt-llm?/tool-files"]
# `--workspace s3://bucket/prefix`: keep the workspace in S3 or an S3 compatible
# object store instead of a directory (`graphrt-files/s3`: a small signed client
# over the reqwest and sha2 the CLI already links, no AWS SDK). Opt-in.
files-s3 = ["files", "graphrt-files/s3"]
# `--store s3://bucket/prefix`: runs, conversations, devices and push
# subscriptions in an S3 bucket that several servers share (Lambda instances),
# with conditional writes instead of a lock (no database, nothing billed while
# idle but storage). See docs/serving.md, "A store in S3".
store-s3 = ["dep:graphrt-files", "graphrt-files/s3"]
# Images: `vision` inputs are checked, stripped of metadata and downscaled before they
# reach a model, `--image-tools` adds the `image` tools to a workspace and
# `--image-model` an image generator (OpenAI images API).
image = ["files", "dep:graphrt-image", "graphrt-llm?/vision-preparer"]
# `--document-tools`: agents create PDF, Word and Excel files in the workspace
# (the `documents` tools of graphrt-docgen). Inert without the flag.
documents = ["files", "dep:graphrt-docgen"]
# HEIC photos as vision input and for the `image` tools (`graphrt-image/heic`: a pure
# Rust decoder, +0.9 MiB). Opt-in: HEVC is covered by patent pools whatever the
# software licence is, so shipping a decoder is a decision for whoever builds.
image-heic = ["image", "graphrt-image/heic"]
# knowledge-retrieval node (`--knowledge`): embeddings, vector stores, hybrid search, rerank.
rag = ["dep:graphrt-rag"]
# Knowledge connectors (`sources:` of a knowledge config): web pages and crawls,
# REST APIs, Google Drive, Notion and SharePoint, synced incrementally on a
# schedule by `graphrt serve` and on request by `graphrt kb sync`. Not in the
# slim builds (`serve,llm,plugins`). See docs/knowledge-connectors.md.
connectors = ["rag", "dep:graphrt-connect"]
# In-process embeddings for knowledge bases (`type: local` embedders): BERT-family
# models run on the CPU with candle, downloaded once from Hugging Face.
local-embed = ["rag", "graphrt-rag/local-embed"]
# Plugins running as child processes or HTTP services (`--plugins`, `graphrt plugin`),
# installed from a directory, a git URL or the plugin catalog (`graphrt plugin install <name>`).
plugins = [
    "dep:graphrt-plugin", "graphrt-plugin/process", "graphrt-plugin/http", "graphrt-plugin/yaml", "graphrt-plugin/git",
    "graphrt-plugin/catalog-signature",
    "dep:reqwest", "dep:rustls", "dep:flate2", "dep:sha2",
]
# Sandboxed WebAssembly plugins (manifests with `runtime: wasm`, or bare `.wasm` files).
# Accept MCP server preset plugins (`runtime: mcp`) and plugin `templates` in `plugin install/list`.
mcp-presets = ["dep:graphrt-plugin", "graphrt-plugin/mcp-presets"]
wasm = ["dep:graphrt-plugin", "graphrt-plugin/yaml", "dep:graphrt-wasm", "graphrt-wasm/tokio"]
# Portable bundles (`.grt`): `graphrt bundle`, and running / serving bundles directly.
bundle = ["wasm", "dep:graphrt-bundle", "graphrt-bundle/wasm", "dep:sha2"]
# MCP tool servers (`--mcp`).
mcp = ["dep:graphrt-mcp"]
# `kind: replay` model providers in providers files: record responses to
# cassette files and replay them offline (deterministic runs, evals, CI).
replay = ["llm", "graphrt-llm/replay"]
# Agent skills: `graphrt skill` and the `skills` field of `agent` nodes, served
# from the skill store in `$GRAPHRT_SKILLS_DIR` or `~/.graphrt/skills`. Opt-in
# (`--features skills`): the release binaries and the GHCR image are built with
# it, the slim agent builds of bench/budgets.toml are not. See docs/skills.md.
skills = ["llm", "graphrt-llm/skills", "graphrt-llm/text-model", "dep:graphrt-skill"]
# Self learning: `graphrt learn` and the `learning` field of `agent` nodes,
# served from the lesson store in `$GRAPHRT_LEARNING_DIR` or
# `~/.graphrt/learning`. Opt-in (`--features learning`): the release binaries
# and the GHCR image are built with it, the slim agent builds are not. See
# docs/learning.md.
learning = ["llm", "graphrt-llm/learning", "graphrt-llm/text-model", "dep:graphrt-learn", "dep:graphrt-skill", "graphrt-gateway?/feedback"]
# `graphrt eval`: run a workflow against test cases with assertions and a CI
# gate (JSON and JUnit reports). Pulls in `replay`. Opt-in (`--features eval`):
# the release binaries and the GHCR image are built with it.
eval = ["replay", "dep:graphrt-eval"]
# OpenTelemetry traces and metrics over OTLP/HTTP (`--otel`, `--otel-stdout`).
otel = ["dep:graphrt-otel"]
# mimalloc as the global allocator. Much faster than musl's allocator, which the
# static release binaries and the container image would otherwise use, and than
# the macOS one (about 40% fewer instructions per instant LLM run). Off by
# default for small devices: the static musl `serve` build idles at ~12 MiB RSS
# with it instead of ~4.4 MiB and is OOM-killed in a 16 MiB container under
# load; it also adds ~140 KiB to the binary.
# Built with `no_thp`: mimalloc otherwise asks for transparent huge pages on
# its arenas, and every touched 2 MiB page counts in full towards RSS (the
# gateway idled at 20 MiB and held 156 MiB with 1,000 streams; 8 / 79 without).
mimalloc = ["dep:mimalloc"]
# `graphrt serve`: HTTP + SSE API, webhook triggers (`--webhooks`). Completion
# callbacks of webhooks additionally need `http` (they go through its egress policy).
serve = ["dep:axum", "dep:http-body", "dep:sha2", "tokio/rt-multi-thread", "tokio/net", "tokio/sync"]
# `serve --trust-gateway`: run as an agent behind a graphrt gateway (signed
# `/internal/v1` API, reclaim of runs whose gateway stream broke). HMAC on the
# `sha2` crate `serve` already links and a hand-written HTTP/1.1 client for the
# reports to the gateway, so it adds no crates. See docs/gateway-protocol.md.
trust-gateway = ["serve"]
# End-user JWT verification and per-user rate limits for `serve` (`--verify-jwt`,
# `--user-rate-limit`): HS256 / ES256 / RS256 with `ring` and a JWKS fetched with
# `reqwest`, both already linked for TLS, so it adds no new crates.
jwt = ["serve", "dep:reqwest", "dep:rustls", "dep:ring", "dep:base64", "dep:thiserror"]
# Browsers on other origins may call `serve` (`--cors-origin`, off unless given):
# an explicit origin allowlist, preflight answers, no credentialed wildcard.
cors = ["serve"]
# `GET /v1/runs/{id}/events?responses=true`: a caller that follows a run it did
# not start in the same request (an async run, a reconnect) receives the answer
# text too. Each run keeps what its answer assembler starts from.
run-follow = ["serve"]
# Conversations kept by the server (`serve --conversations`, off unless given):
# a run names a `conversation_id` instead of sending `sys.history`. Scoped to the
# verified end user, with limits and retention.
conversations = ["serve", "dep:thiserror"]
# The chat page and the embeddable widget served by `serve --chat WORKFLOW`
# (off unless given), with guest sessions (`--chat-access guests`). The page is
# built from `web/` and embedded in the binary (about 100 KiB).
web-chat = ["jwt", "run-follow"]
# Access tokens for monitoring devices (`serve --devices`, off unless given):
# scoped to reading runs and resolving approvals, listed, revocable, stored hashed.
devices = ["jwt"]
# The approvals inbox (`serve --approvals`, off unless given): every run that
# waits for a person, and a way to answer; `--expire-approvals` carries out
# `on_expire` of `human-input` nodes.
approvals = ["devices"]
# Notifications when a run fails or waits for a person: the `Notifier` trait
# and its dispatcher. Web Push below is the one notifier shipped.
notify = ["serve", "dep:thiserror"]
# Web Push notifications (`serve --push CONTACT`, off unless given): VAPID and
# message encryption with `ring`, requests through the egress policy of `http`.
web-push = ["notify", "devices", "http"]
# The monitoring page served by `serve --monitor` (off unless given): runs, run
# details and the approvals inbox, installable as a web app. Built from `web/`
# and embedded in the binary.
web-monitor = ["approvals", "run-follow"]
# Messaging channels (`serve --channel KIND=WORKFLOW`, off unless given): a
# customer writes on the channel, the workflow runs, the answer goes back, with
# one conversation per customer. `channels` is the shared part; a channel is
# built in by its own feature, and a build without it has none of its code.
channels = ["conversations", "approvals", "dep:graphrt-channel", "graphrt-channel/client", "dep:graphrt-ui", "dep:reqwest", "dep:rustls", "dep:ring"]
# Telegram, through the official Bot API: long polling or a webhook.
channel-telegram = ["channels", "graphrt-channel/telegram"]
# WhatsApp, through the official Cloud API: a signed webhook.
channel-whatsapp = ["channels", "graphrt-channel/whatsapp"]
# Slack: Socket Mode (no public address) or the Events API, threads as
# conversations, Block Kit answers and buttons, and `notify` targets.
channel-slack = ["channels", "notify", "graphrt-channel/slack", "graphrt-channel/socket-mode"]
# Microsoft Teams through an Azure Bot: the Bot Framework token check, 1:1 and
# channel conversations, Adaptive Card answers and buttons, `notify` targets.
channel-teams = ["channels", "notify", "graphrt-channel/teams"]
# The admin console of `serve --console FILE` (off unless given): sign in with
# OpenID Connect, roles on every route, an audit log, encrypted secrets and an
# agent registry with environments, in the `graphrt-console` crate. Opt-in.
# See docs/console.md.
console = ["serve", "jwt", "dep:graphrt-console"]
# `graphrt collab`: the collaboration server (team workspaces, live co-editing of
# agent projects, invites, versions, plugin services), hosted or self hosted from
# one binary. Opt-in and separate from `serve`: nothing changes for single player
# use. The `:<version>-collab` image is built with only this feature. See docs/collab.md.
collab = ["console", "dep:graphrt-collab", "graphrt-collab/server", "graphrt-collab/services"]
# Evaluation scores of served runs: `GET /v1/runs/{id}/scores` and human
# feedback (`POST /v1/runs/{id}/feedback`), kept next to each run in the store.
scores = ["serve"]
# Online evaluation in `serve` (`--evaluators`): a sample of finished runs is
# scored in a bounded background pool with the assertions of `graphrt eval`
# (judge workflows included). Needs `eval`; opt-in like it.
online-eval = ["scores", "eval", "tokio/sync"]
# Upload online and human scores to Langfuse (`serve --langfuse-scores`), through
# the `http` egress policy, with the `langfuse` OTel preset's credentials.
langfuse = ["scores", "otel", "http", "tokio/sync"]
# `graphrt gateway` (always-on front of scale-to-zero agents: SQLite store, auth,
# limits, webhooks, cron, local-process provider) and `graphrt deploy --target local`.
# Opt-in; pulls in mimalloc (the gateway build only, decision 10: agents stay without it).
# Includes `trust-gateway`: local-process agents (`--dev`, `kind: local`) are
# `graphrt serve --trust-gateway` of this same binary (+49 KiB, macOS arm64).
gateway = ["serve", "trust-gateway", "dep:graphrt-gateway", "graphrt-gateway/gw-local", "dep:graphrt-provider-api", "mimalloc", "dep:ring"]
# Remote providers of `graphrt gateway` and their `graphrt deploy --target` drivers.
gateway-k8s = ["gateway", "graphrt-gateway/deploy-k8s"]
# In-cluster-only Kubernetes provider, without kubeconfig support or the deploy driver (smallest gateway build).
gateway-k8s-in-cluster = ["gateway", "graphrt-gateway/gw-k8s"]
gateway-cloud-run = ["gateway", "graphrt-gateway/deploy-cloud-run"]
gateway-ecs = ["gateway", "graphrt-gateway/deploy-ecs"]
gateway-lambda = ["gateway", "graphrt-gateway/deploy-lambda"]
gateway-fly = ["gateway", "graphrt-gateway/deploy-fly"]
gateway-aca = ["gateway", "graphrt-gateway/deploy-aca"]
# Every provider (plan §9 budget: ≤ 9 MiB).
gateway-all = ["gateway-k8s", "gateway-cloud-run", "gateway-ecs", "gateway-lambda", "gateway-fly", "gateway-aca"]
# `graphrt deploy --target fly --direct` (and `deploy status|list-versions|rollback|
# pause|resume|remove`): an agent served by the Fly proxy at https://<app>.fly.dev,
# no gateway. A small Machines REST client over the reqwest + rustls `http` already
# links; see docs/deploy-direct.md.
deploy-fly = ["dep:graphrt-provider-fly", "graphrt-provider-fly/direct", "dep:graphrt-provider-api", "graphrt-provider-api/direct", "dep:reqwest", "dep:rustls", "dep:getrandom", "dep:graphrt-bundle"]
# `graphrt deploy --target cloud-run --direct`: one agent served straight by
# Google Cloud Run, no gateway (docs/deploy-cloud-run.md).
deploy-cloud-run = ["dep:graphrt-gcp", "graphrt-gcp/direct-cloud-run", "dep:graphrt-provider-api", "graphrt-provider-api/direct", "dep:reqwest", "dep:rustls", "dep:getrandom", "dep:graphrt-bundle"]
# `graphrt deploy --target lambda --direct` (and the same management subcommands):
# an agent on a public AWS Lambda Function URL, scaled to zero, no gateway. Signs
# with the AWS credentials of the environment or a profile (`--profile`); see
# docs/deploy-direct-aws.md.
deploy-aws = ["dep:graphrt-provider-aws", "graphrt-provider-aws/direct-lambda", "dep:graphrt-provider-api", "graphrt-provider-api/direct", "dep:reqwest", "dep:rustls", "dep:getrandom", "dep:graphrt-bundle"]
# Opt-in anonymous usage telemetry of the CLI binary (`graphrt telemetry`). Off
# by default and inert unless an endpoint is configured; see docs/telemetry.md.
telemetry = ["http", "dep:getrandom"]

[dependencies]
graphrt-core = { workspace = true, features = ["yaml", "jinja", "tokio"] }
mimalloc = { version = "0.1.52", optional = true, default-features = false, features = ["no_thp"] }
graphrt-llm = { workspace = true, optional = true, features = ["openai", "anthropic", "gemini", "bedrock", "typesafe"] }
graphrt-http = { workspace = true, optional = true }
graphrt-code = { workspace = true, optional = true, features = ["js", "tokio"] }
graphrt-mcp = { workspace = true, optional = true, features = ["stdio", "http"] }
graphrt-doc = { workspace = true, optional = true, features = ["default", "tokio"] }
graphrt-files = { workspace = true, optional = true, features = ["tokio"] }
graphrt-docgen = { workspace = true, optional = true, features = ["tokio", "office", "tools"] }
graphrt-image = { workspace = true, optional = true, features = ["tokio", "process", "tools", "generate-openai", "generate-gemini"] }
graphrt-rag = { workspace = true, optional = true, features = ["default"] }
graphrt-connect = { workspace = true, optional = true, features = ["default"] }
graphrt-plugin = { workspace = true, optional = true }
graphrt-skill = { workspace = true, optional = true }
graphrt-learn = { workspace = true, optional = true }
graphrt-memory = { workspace = true, optional = true }
graphrt-wasm = { workspace = true, optional = true }
graphrt-otel = { workspace = true, optional = true, features = ["http"] }
graphrt-bundle = { workspace = true, optional = true }
graphrt-eval = { workspace = true, optional = true }
graphrt-channel = { workspace = true, optional = true }
graphrt-ui = { workspace = true, optional = true }
graphrt-gateway = { workspace = true, optional = true }
graphrt-provider-api = { workspace = true, optional = true }
graphrt-provider-fly = { workspace = true, optional = true }
graphrt-gcp = { workspace = true, optional = true }
graphrt-provider-aws = { workspace = true, optional = true }
graphrt-console = { workspace = true, optional = true }
graphrt-collab = { workspace = true, optional = true }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
tokio = { workspace = true, features = ["rt", "time", "signal", "fs", "io-util", "sync", "net", "macros"] }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
# Plugin catalog downloads (`plugins`): the same HTTP client, TLS, gzip and sha256
# crates the workspace already uses.
reqwest = { workspace = true, optional = true, features = ["rustls-no-provider"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
flate2 = { version = "1", optional = true }
sha2 = { version = "0.11", optional = true, default-features = false }
getrandom = { version = "0.4", optional = true }
# `jwt`: signature checks (the same `ring` rustls uses) and base64url.
ring = { version = "0.17", optional = true, default-features = false, features = ["alloc"] }
base64 = { version = "0.23", optional = true }
thiserror = { workspace = true, optional = true }
axum ={ version = "0.8", optional = true, default-features = false, features = ["http1", "json", "query", "tokio"] }
# Already linked through axum/hyper; named for `Frame` in the body drain of `serve`.
http-body = { version = "1", optional = true }

[dev-dependencies]
# The fake Fly Machines API for the `graphrt deploy --direct` contract tests.
graphrt-provider-fly = { workspace = true, features = ["fake"] }
# The fake Google APIs for the `graphrt deploy --target cloud-run --direct` contract tests.
graphrt-gcp = { workspace = true, features = ["fake"] }
# The abstract store conformance suite runs against the memory and directory stores.
graphrt-core = { workspace = true, features = ["yaml", "jinja", "tokio", "store-conformance"] }
# Signs the test plugin catalogs with throwaway keys (tests/plugin_catalog.rs).
minisign = "0.10"
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body-util = "0.1"
jsonschema = { version = "0.63", default-features = false }
tokio = { workspace = true, features = ["rt", "macros", "time"] }
# Store unit tests drive futures with block_on.
futures = { workspace = true, features = ["executor"] }
# The fake Slack Socket Mode server of tests/serve_slack_teams.rs.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[lints]
workspace = true
