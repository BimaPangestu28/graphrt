[package]
name = "graphrt-cli"
description = "The graphrt command-line runner and HTTP server for agentic workflow graphs."
readme = "README.md"
documentation = "https://docs.rs/graphrt-cli"
homepage = "https://github.com/Graphrt/graphrt"
keywords = ["workflow", "agent", "llm", "cli", "runtime"]
categories = ["command-line-utilities", "development-tools"]
version.workspace = true
edition.workspace = true
# `std::fs::File::lock` (run store) needs Rust 1.89; the libraries keep the workspace MSRV.
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "graphrt_cli"
path = "src/lib.rs"

[[bin]]
name = "graphrt"
path = "src/main.rs"

[features]
default = ["llm", "http", "code", "python", "mcp", "doc", "rag", "local-embed", "plugins", "mcp-presets", "wasm", "otel", "bundle", "serve", "trust-gateway", "jwt", "telemetry", "scores", "langfuse", "deploy-fly"]
# llm, question-classifier, parameter-extractor and agent nodes.
llm = ["dep:graphrt-llm"]
# http-request node with SSRF-safe egress.
http = ["dep:graphrt-http", "dep:reqwest"]
# code node (embedded JavaScript).
code = ["dep:graphrt-code"]
# Python code nodes via a local subprocess, enabled per run with `--allow-python-subprocess`.
python = ["code", "graphrt-code/python"]
# document-extractor node (PDF, Office, spreadsheets, HTML, EPUB, email...).
doc = ["dep:graphrt-doc"]
# knowledge-retrieval node (`--knowledge`): embeddings, vector stores, hybrid search, rerank.
rag = ["dep:graphrt-rag"]
# In-process embeddings for knowledge bases (`type: local` embedders): BERT-family
# models run on the CPU with candle, downloaded once from Hugging Face.
local-embed = ["rag", "graphrt-rag/local-embed"]
# Plugins running as child processes or HTTP services (`--plugins`, `graphrt plugin`),
# installed from a directory, a git URL or the plugin catalog (`graphrt plugin install <name>`).
plugins = [
    "dep:graphrt-plugin", "graphrt-plugin/process", "graphrt-plugin/http", "graphrt-plugin/yaml", "graphrt-plugin/git",
    "dep:reqwest", "dep:rustls", "dep:flate2", "dep:sha2",
]
# Sandboxed WebAssembly plugins (manifests with `runtime: wasm`, or bare `.wasm` files).
# Accept MCP server preset plugins (`runtime: mcp`) and plugin `templates` in `plugin install/list`.
mcp-presets = ["dep:graphrt-plugin", "graphrt-plugin/mcp-presets"]
wasm = ["dep:graphrt-plugin", "graphrt-plugin/yaml", "dep:graphrt-wasm", "graphrt-wasm/tokio"]
# Portable bundles (`.grt`): `graphrt bundle`, and running / serving bundles directly.
bundle = ["wasm", "dep:graphrt-bundle", "graphrt-bundle/wasm"]
# MCP tool servers (`--mcp`).
mcp = ["dep:graphrt-mcp"]
# `kind: replay` model providers in providers files: record responses to
# cassette files and replay them offline (deterministic runs, evals, CI).
replay = ["llm", "graphrt-llm/replay"]
# Agent skills (preview, opt-in): `graphrt skill` and the `skills` field of `agent`
# nodes, served from the skill store in `$GRAPHRT_SKILLS_DIR` or `~/.graphrt/skills`.
# See docs/skills.md.
skills = ["llm", "graphrt-llm/skills", "dep:graphrt-skill"]
# Self learning (preview, opt-in): `graphrt learn` and the `learning` field of
# `agent` nodes, served from the lesson store in `$GRAPHRT_LEARNING_DIR` or
# `~/.graphrt/learning`. See docs/learning.md.
learning = ["llm", "graphrt-llm/learning", "dep:graphrt-learn"]
# `graphrt eval`: run a workflow against test cases with assertions and a CI
# gate (JSON and JUnit reports). Pulls in `replay`. Opt-in (`--features eval`):
# the release binaries and the GHCR image are built with it.
eval = ["replay", "dep:graphrt-eval"]
# OpenTelemetry traces and metrics over OTLP/HTTP (`--otel`, `--otel-stdout`).
otel = ["dep:graphrt-otel"]
# mimalloc as the global allocator. Much faster than musl's allocator, which the
# static release binaries and the container image would otherwise use, and than
# the macOS one (about 40% fewer instructions per instant LLM run). Off by
# default for small devices: the static musl `serve` build idles at ~12 MiB RSS
# with it instead of ~4.4 MiB and is OOM-killed in a 16 MiB container under
# load; it also adds ~140 KiB to the binary.
# Built with `no_thp`: mimalloc otherwise asks for transparent huge pages on
# its arenas, and every touched 2 MiB page counts in full towards RSS (the
# gateway idled at 20 MiB and held 156 MiB with 1,000 streams; 8 / 79 without).
mimalloc = ["dep:mimalloc"]
# `graphrt serve`: HTTP + SSE API, webhook triggers (`--webhooks`). Completion
# callbacks of webhooks additionally need `http` (they go through its egress policy).
serve = ["dep:axum", "dep:http-body", "dep:sha2", "tokio/rt-multi-thread", "tokio/net", "tokio/sync"]
# `serve --trust-gateway`: run as an agent behind a graphrt gateway (signed
# `/internal/v1` API, reclaim of runs whose gateway stream broke). HMAC on the
# `sha2` crate `serve` already links and a hand-written HTTP/1.1 client for the
# reports to the gateway, so it adds no crates. See docs/gateway-protocol.md.
trust-gateway = ["serve"]
# End-user JWT verification and per-user rate limits for `serve` (`--verify-jwt`,
# `--user-rate-limit`): HS256 / ES256 / RS256 with `ring` and a JWKS fetched with
# `reqwest`, both already linked for TLS, so it adds no new crates.
jwt = ["serve", "dep:reqwest", "dep:rustls", "dep:ring", "dep:base64", "dep:thiserror"]
# Evaluation scores of served runs: `GET /v1/runs/{id}/scores` and human
# feedback (`POST /v1/runs/{id}/feedback`), kept next to each run in the store.
scores = ["serve"]
# Online evaluation in `serve` (`--evaluators`): a sample of finished runs is
# scored in a bounded background pool with the assertions of `graphrt eval`
# (judge workflows included). Needs `eval`; opt-in like it.
online-eval = ["scores", "eval", "tokio/sync"]
# Upload online and human scores to Langfuse (`serve --langfuse-scores`), through
# the `http` egress policy, with the `langfuse` OTel preset's credentials.
langfuse = ["scores", "otel", "http", "tokio/sync"]
# `graphrt gateway` (always-on front of scale-to-zero agents: SQLite store, auth,
# limits, webhooks, cron, local-process provider) and `graphrt deploy --target local`.
# Opt-in; pulls in mimalloc (the gateway build only, decision 10: agents stay without it).
# Includes `trust-gateway`: local-process agents (`--dev`, `kind: local`) are
# `graphrt serve --trust-gateway` of this same binary (+49 KiB, macOS arm64).
gateway = ["serve", "trust-gateway", "dep:graphrt-gateway", "graphrt-gateway/gw-local", "dep:graphrt-provider-api", "mimalloc", "dep:ring"]
# Remote providers of `graphrt gateway` and their `graphrt deploy --target` drivers.
gateway-k8s = ["gateway", "graphrt-gateway/deploy-k8s"]
# In-cluster-only Kubernetes provider, without kubeconfig support or the deploy driver (smallest gateway build).
gateway-k8s-in-cluster = ["gateway", "graphrt-gateway/gw-k8s"]
gateway-cloud-run = ["gateway", "graphrt-gateway/deploy-cloud-run"]
gateway-ecs = ["gateway", "graphrt-gateway/deploy-ecs"]
gateway-lambda = ["gateway", "graphrt-gateway/deploy-lambda"]
gateway-fly = ["gateway", "graphrt-gateway/deploy-fly"]
gateway-aca = ["gateway", "graphrt-gateway/deploy-aca"]
# Every provider (plan §9 budget: ≤ 9 MiB).
gateway-all = ["gateway-k8s", "gateway-cloud-run", "gateway-ecs", "gateway-lambda", "gateway-fly", "gateway-aca"]
# `graphrt deploy --target fly --direct` (and `deploy status|list-versions|rollback|
# pause|resume|remove`): an agent served by the Fly proxy at https://<app>.fly.dev,
# no gateway. A small Machines REST client over the reqwest + rustls `http` already
# links; see docs/deploy-direct.md.
deploy-fly = ["dep:graphrt-provider-fly", "graphrt-provider-fly/direct", "dep:reqwest", "dep:rustls", "dep:getrandom"]
# Opt-in anonymous usage telemetry of the CLI binary (`graphrt telemetry`). Off
# by default and inert unless an endpoint is configured; see docs/telemetry.md.
telemetry = ["http", "dep:getrandom"]

[dependencies]
graphrt-core = { workspace = true, features = ["yaml", "jinja", "tokio"] }
mimalloc = { version = "0.1.52", optional = true, default-features = false, features = ["no_thp"] }
graphrt-llm = { workspace = true, optional = true, features = ["openai", "anthropic", "gemini", "bedrock", "typesafe"] }
graphrt-http = { workspace = true, optional = true }
graphrt-code = { workspace = true, optional = true, features = ["js", "tokio"] }
graphrt-mcp = { workspace = true, optional = true, features = ["stdio", "http"] }
graphrt-doc = { workspace = true, optional = true, features = ["default", "tokio"] }
graphrt-rag = { workspace = true, optional = true, features = ["default"] }
graphrt-plugin = { workspace = true, optional = true }
graphrt-skill = { workspace = true, optional = true }
graphrt-learn = { workspace = true, optional = true }
graphrt-wasm = { workspace = true, optional = true }
graphrt-otel = { workspace = true, optional = true, features = ["http"] }
graphrt-bundle = { workspace = true, optional = true }
graphrt-eval = { workspace = true, optional = true }
graphrt-gateway = { workspace = true, optional = true }
graphrt-provider-api = { workspace = true, optional = true }
graphrt-provider-fly = { workspace = true, optional = true }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
tokio = { workspace = true, features = ["rt", "time", "signal", "fs", "io-util", "sync", "net", "macros"] }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
# Plugin catalog downloads (`plugins`): the same HTTP client, TLS, gzip and sha256
# crates the workspace already uses.
reqwest = { workspace = true, optional = true, features = ["rustls-no-provider"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
flate2 = { version = "1", optional = true }
sha2 = { version = "0.11", optional = true, default-features = false }
getrandom = { version = "0.4", optional = true }
# `jwt`: signature checks (the same `ring` rustls uses) and base64url.
ring = { version = "0.17", optional = true, default-features = false, features = ["alloc"] }
base64 = { version = "0.23", optional = true }
thiserror = { workspace = true, optional = true }
axum ={ version = "0.8", optional = true, default-features = false, features = ["http1", "json", "query", "tokio"] }
# Already linked through axum/hyper; named for `Frame` in the body drain of `serve`.
http-body = { version = "1", optional = true }

[dev-dependencies]
# The fake Fly Machines API for the `graphrt deploy --direct` contract tests.
graphrt-provider-fly = { workspace = true, features = ["fake"] }
# The abstract store conformance suite runs against the memory and directory stores.
graphrt-core = { workspace = true, features = ["yaml", "jinja", "tokio", "store-conformance"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body-util = "0.1"
jsonschema = { version = "0.61", default-features = false }
tokio = { workspace = true, features = ["rt", "macros", "time"] }
# Store unit tests drive futures with block_on.
futures = { workspace = true, features = ["executor"] }

[lints]
workspace = true
