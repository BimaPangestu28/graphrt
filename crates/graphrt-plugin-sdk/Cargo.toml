[package]
name = "graphrt-plugin-sdk"
description = "SDK for writing graphrt plugins in Rust: expose node kinds and tools over the graphrt plugin protocol."
readme = "README.md"
documentation = "https://docs.rs/graphrt-plugin-sdk"
homepage = "https://github.com/Graphrt/graphrt"
keywords = ["plugin", "sdk", "json-rpc", "workflow", "agent"]
categories = ["development-tools", "api-bindings"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "io-util", "io-std", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "io-util"] }

[lints]
workspace = true
