[package]
name = "graphrt-rag"
description = "Retrieval building blocks for graphrt: embedders, vector stores, hybrid search, reranking, chunking and the knowledge-retrieval node."
readme = "README.md"
documentation = "https://docs.rs/graphrt-rag"
homepage = "https://github.com/BimaPangestu28/graphrt"
keywords = ["rag", "embeddings", "vector-search", "bm25", "retrieval"]
categories = ["text-processing", "database"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["http", "qdrant", "fs", "sqlite", "yaml", "doc"]
# OpenAI-compatible embeddings, generic HTTP retriever and HTTP reranker (reqwest + rustls/ring).
http = ["dep:reqwest", "dep:rustls"]
# Qdrant vector store over its REST API.
qdrant = ["http", "dep:sha2"]
# File persistence for `MemoryStore`.
fs = []
# `SqliteStore`: a persistent store in one SQLite file (SQLite is compiled in).
sqlite = ["dep:rusqlite"]
# `LocalEmbedder`: sentence-embedding models (BERT family) run in-process with
# candle, on the CPU. Downloading models from Hugging Face needs `http`;
# a local model directory works without it.
local-embed = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]
# Load `KnowledgeConfig` from YAML.
yaml = ["dep:serde-saphyr"]
# Ingest PDF / Office / spreadsheet / HTML / EPUB / email files via graphrt-doc.
doc = ["dep:graphrt-doc"]

[dependencies]
graphrt-core.workspace = true
graphrt-doc = { workspace = true, optional = true, features = ["default"] }
futures.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
serde-saphyr = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["rustls-no-provider", "json"] }
sha2 = { version = "0.11", optional = true, default-features = false }
candle-core = { version = "0.11", optional = true, default-features = false }
candle-nn = { version = "0.11", optional = true, default-features = false }
candle-transformers = { version = "0.11", optional = true, default-features = false }
tokenizers = { version = "0.23", optional = true, default-features = false, features = ["fancy-regex"] }
rusqlite = { version = "0.40", optional = true, features = ["bundled"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
futures = { workspace = true, features = ["executor"] }
graphrt-core = { workspace = true, features = ["tokio"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }

[lints]
workspace = true
