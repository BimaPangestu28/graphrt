[package]
name = "graphrt-http"
description = "HTTP request node with SSRF protection for the graphrt workflow runtime."
readme = "README.md"
documentation = "https://docs.rs/graphrt-http"
homepage = "https://github.com/BimaPangestu28/graphrt"
keywords = ["http", "ssrf", "workflow", "agent", "llm"]
categories = ["network-programming", "web-programming::http-client"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
graphrt-core.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
thiserror.workspace = true
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { workspace = true, features = ["net"] }
url = "2"
base64 = "0.22"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }

[lints]
workspace = true
