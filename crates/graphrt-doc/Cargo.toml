[package]
name = "graphrt-doc"
description = "Document extraction node (PDF, Office, spreadsheets, HTML, e-mail, subtitles) for the graphrt workflow runtime."
readme = "README.md"
documentation = "https://docs.rs/graphrt-doc"
homepage = "https://github.com/Graphrt/graphrt"
keywords = ["pdf", "docx", "xlsx", "extraction", "rag"]
categories = ["text-processing", "parsing"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["pdf", "office", "spreadsheet", "epub", "email", "tokio"]
# Run extraction on Tokio's blocking pool when a Tokio runtime is present.
tokio = ["dep:tokio", "tokio/rt"]
# PDF text extraction (pure Rust).
pdf = ["dep:pdf-extract", "dep:flate2", "dep:weezl"]
# DOCX and PPTX (zip + XML).
office = ["zip-formats"]
# EPUB (zip + XHTML).
epub = ["zip-formats"]
# XLSX / ODS (pure Rust). Archives and sheet dimensions are checked before parsing.
spreadsheet = ["dep:calamine", "zip-formats"]
# Legacy binary XLS (BIFF). Off by default: the parser loads every sheet into a
# dense grid up front, so a crafted file can request a very large allocation.
xls = ["spreadsheet"]
# RFC 5322 e-mail (.eml).
email = ["dep:mail-parser"]
zip-formats = ["dep:zip", "dep:quick-xml"]

[dependencies]
graphrt-core.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
encoding_rs = "0.8"
pdf-extract = { version = "0.12", optional = true }
# The PDF parser's zlib and LZW decoders; used here to pre-check stream sizes.
flate2 = { version = "1", optional = true }
weezl = { version = "0.1.12", optional = true }
calamine = { version = "0.38", default-features = false, optional = true }
zip = { version = "9", default-features = false, features = ["deflate"], optional = true }
quick-xml = { version = "0.42", optional = true }
mail-parser = { version = "0.11", default-features = false, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
weezl = "0.1.12"
futures = { workspace = true, features = ["executor"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = "1"

[lints]
workspace = true
