[package]
name = "graphrt-core"
description = "Executor-agnostic graph runtime for agentic AI workflows: graph model, variable pool, scheduler, events, snapshots and built-in control nodes."
readme = "README.md"
documentation = "https://docs.rs/graphrt-core"
homepage = "https://github.com/Graphrt/graphrt"
keywords = ["workflow", "agent", "llm", "runtime", "graph"]
categories = ["asynchronous", "development-tools", "wasm"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["yaml", "jinja", "tokio", "tool-files"]
# The `tool` node's `files` output lists the files a native tool returned in its
# structured result (`tool::collect_files`). Builds without native file tools leave
# it out: plugins and MCP servers cannot return file values, so the output stays empty.
tool-files = []
# Load workflow documents from YAML (pure Rust, wasm-friendly).
yaml = ["dep:serde-saphyr"]
# Jinja2-compatible template-transform node (sandboxed minijinja with fuel limits).
jinja = ["dep:minijinja"]
# Tokio-backed clock (timers for retries and timeouts). The engine itself never requires tokio.
tokio = ["dep:tokio", "tokio/time", "tokio/rt"]
# Abstract conformance suite for `RunStore` / `CoordinationStore` implementations
# (`graphrt_core::store_conformance`), for the tests of store backends.
store-conformance = []
# Cron expressions and time zones (`graphrt_core::cron`), for schedules: the
# gateway's cron triggers and the sync schedules of knowledge sources.
cron = []
# The memory contract (`graphrt_core::memory`): notes an agent saves and finds
# again in later runs. Left out of builds without long term memory.
memory = []
# Workflows linked to a run that its nodes start as child runs (an agent's
# `subagents`): `Engine::with_linked`, `NodeContext::children`.
subagents = []

[dependencies]
futures.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
smallvec.workspace = true
minijinja = { workspace = true, optional = true }
serde-saphyr = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time"] }
futures = { workspace = true, features = ["executor"] }

[lints]
workspace = true

[[bench]]
name = "engine"
harness = false
