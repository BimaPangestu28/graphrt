[package]
name = "graphrt-collab"
description = "Real time collaboration for graphrt agent projects: a CRDT document model, the sync protocol, a collaboration server with team workspaces and plugin services, and a client."
readme = "README.md"
documentation = "https://docs.rs/graphrt-collab"
homepage = "https://github.com/Graphrt/graphrt"
keywords = ["agent", "collaboration", "crdt", "realtime", "graphrt"]
categories = ["web-programming::websocket", "asynchronous"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# The collaboration server: accounts and sign in, team workspaces with the
# console's roles, live rooms, versions, the audit log and secrets per workspace.
server = [
    "dep:graphrt-console", "dep:graphrt-core", "dep:axum", "dep:tokio", "dep:futures", "dep:ring",
    "dep:base64", "dep:rustls", "dep:tokio-rustls",
]
# Plugin services on the server: plugins that declare server side services
# (`services` in their manifest), run with the plugin host, sandboxed like every plugin.
services = ["server", "dep:graphrt-plugin", "graphrt-plugin/process", "graphrt-plugin/http", "graphrt-plugin/yaml"]
# The client: sign in, workspaces and projects over HTTP, live sync over a WebSocket.
client = ["dep:tokio", "dep:futures", "dep:reqwest", "dep:tokio-tungstenite", "dep:rustls", "dep:rustls-platform-verifier", "dep:ring", "dep:base64"]

[dependencies]
yrs = { version = "0.26", default-features = false, features = ["sync"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
graphrt-console = { workspace = true, optional = true }
graphrt-core = { workspace = true, optional = true, features = ["yaml"] }
graphrt-plugin = { workspace = true, optional = true }
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
tokio = { workspace = true, optional = true, features = ["rt", "sync", "time", "net", "macros", "fs"] }
futures = { workspace = true, optional = true, features = ["std"] }
ring = { version = "0.17", optional = true, default-features = false, features = ["alloc"] }
base64 = { version = "0.23", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12"] }
reqwest = { workspace = true, optional = true, features = ["rustls-no-provider", "json"] }
tokio-tungstenite = { version = "0.29", optional = true, default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
rustls-platform-verifier = { version = "0.7", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
graphrt-console = { workspace = true }
graphrt-core = { workspace = true, features = ["yaml"] }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
