[package]
name = "graphrt-gateway"
description = "The graphrt gateway: always-on front of scale-to-zero agents, sole writer of the run store (SQLite), auth, limits, webhooks, cron and the local-process provider."
readme = "README.md"
keywords = ["workflow", "agent", "gateway", "scale-to-zero", "sse"]
categories = ["web-programming::http-server"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["gw-local"]
# local-process provider: one `graphrt serve --trust-gateway` process per replica on a Unix socket.
gw-local = []

[dependencies]
graphrt-core = { workspace = true, features = ["tokio"] }
graphrt-provider-api = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
indexmap.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros", "process", "io-util", "fs", "signal"] }
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Same bundled SQLite as graphrt-rag's `sqlite` feature.
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = { version = "0.11", default-features = false }
ring = { version = "0.17", default-features = false, features = ["alloc"] }
base64 = "0.22"

[dev-dependencies]
graphrt-core = { workspace = true, features = ["tokio", "store-conformance"] }
graphrt-provider-api = { workspace = true, features = ["conformance"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "test-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body-util = "0.1"
reqwest = { workspace = true, features = ["rustls-no-provider", "json"] }

[lints]
workspace = true
