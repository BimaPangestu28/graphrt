[package]
name = "graphrt-wasm"
description = "Sandboxed WebAssembly plugins for graphrt: add node kinds from portable .wasm modules with fuel and memory limits."
readme = "README.md"
documentation = "https://docs.rs/graphrt-wasm"
homepage = "https://github.com/Graphrt/graphrt"
keywords = ["wasm", "plugin", "sandbox", "wasmi", "workflow"]
categories = ["wasm", "development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# `tokio` is on by default: without it a guest call (up to its whole fuel budget)
# runs on the async worker, stalling other nodes and their timeouts.
default = ["tokio"]
# Run guest calls on tokio's blocking pool when inside a tokio runtime.
tokio = ["dep:tokio", "tokio/rt"]

[dependencies]
graphrt-core.workspace = true
base64 = "0.23"
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
wasmi = { version = "2.0.3", default-features = false, features = ["std", "validate", "auto-dispatch"] }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time"] }
wat = "1"
graphrt-core = { workspace = true, features = ["tokio"] }

[lints]
workspace = true
