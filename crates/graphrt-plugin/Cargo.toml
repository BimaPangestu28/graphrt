[package]
name = "graphrt-plugin"
description = "Plugin host for graphrt: load node kinds and tools from external processes, HTTP services or WebAssembly modules."
readme = "README.md"
documentation = "https://docs.rs/graphrt-plugin"
homepage = "https://github.com/Graphrt/graphrt"
keywords = ["plugin", "json-rpc", "workflow", "agent", "extension"]
categories = ["development-tools", "asynchronous"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["process", "http", "yaml", "git", "mcp-presets", "catalog-signature"]
# Plugins running as child processes speaking JSON-RPC over stdio.
process = ["tokio/process"]
# Plugins served over HTTP.
http = ["dep:reqwest", "dep:rustls"]
# YAML manifests (`graphrt-plugin.yaml`).
yaml = ["graphrt-core/yaml"]
# `install_from_git` (runs the `git` executable; no extra dependencies).
git = []
# `runtime: mcp` (MCP server presets, no code) and `templates` in manifests: parsed and
# validated for hosts that connect MCP servers. Without it, both are unknown manifest fields.
mcp-presets = []
# `catalog_signature`: check the minisign signature of a plugin catalog index
# against trusted public keys (verification only, one crate without dependencies).
catalog-signature = ["dep:minisign-verify"]

[dependencies]
graphrt-core = { workspace = true, features = ["tokio"] }
futures.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "io-util", "macros"] }
sha2 = { version = "0.11", default-features = false }
reqwest = { workspace = true, optional = true, features = ["rustls-no-provider", "json", "stream"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
minisign-verify = { version = "0.3", optional = true }

[dev-dependencies]
# Signs test catalogs with throwaway keys (`catalog_signature` tests).
minisign = "0.10"
graphrt-core = { workspace = true, features = ["tokio", "jinja", "yaml"] }
graphrt-plugin-sdk = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "io-util", "net", "process"] }

[lints]
workspace = true
