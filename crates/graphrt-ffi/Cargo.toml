[package]
name = "graphrt-ffi"
description = "Embedding API for mobile and desktop apps (Kotlin, Swift, Python...) via UniFFI."
readme = "README.md"
documentation = "https://docs.rs/graphrt-ffi"
homepage = "https://github.com/Graphrt/graphrt"
keywords = ["ffi", "uniffi", "mobile", "android", "ios"]
categories = ["api-bindings", "development-tools::ffi"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "graphrt_ffi"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
# Binding generator: `cargo run -p graphrt-ffi --features bindgen-cli --bin uniffi-bindgen -- ...`
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen-cli"]

[features]
# Every feature here is safe on iOS / Android: nothing spawns processes.
default = ["code-js", "mcp-http", "doc", "rag", "context"]
# `context_window` of the `llm` and `agent` nodes (see graphrt-llm's `context`).
context = ["graphrt-llm/context"]
# JavaScript code node (QuickJS, compiled from C).
code-js = ["dep:graphrt-code"]
# Generate QuickJS bindings at build time. Required for Android and iOS targets,
# for which rquickjs ships no prebuilt bindings. Needs libclang on the build host.
mobile-js = ["code-js", "dep:rquickjs"]
# MCP tool servers over streamable HTTP (stdio servers are not available on mobile).
mcp-http = ["dep:graphrt-mcp"]
# document-extractor node (pure Rust).
doc = ["dep:graphrt-doc"]
# knowledge-retrieval node (memory / SQLite / Qdrant / HTTP retrievers; SQLite is compiled from C).
rag = ["dep:graphrt-rag"]
# Agent skills: the `skills` field of `agent` nodes, served from the store in the
# config's `skills_dir` (a directory in the app's own storage). No code of a skill runs.
skills = ["dep:graphrt-skill", "graphrt-llm/skills"]
# Self learning: the `learning` field of `agent` nodes reads approved lessons from
# the store in the config's `learning_dir`. The app reviews lessons through `Runtime`.
learning = ["dep:graphrt-learn", "graphrt-llm/learning"]
# A file workspace for agents (config `workspace`): the `files` tools, confined to one
# directory of the app's own storage, with quotas. With `doc`, `files/read` also
# extracts document text.
files = ["dep:graphrt-files", "graphrt-llm/tool-files", "graphrt-core/tool-files", "graphrt-files?/doc"]
# UI blocks (cards, charts, tables, stat tiles) are validated before the app gets
# them: `validate_ui_block` and the typed `UiBlock` event.
ui = ["dep:graphrt-ui"]
# Photos sent to a model (`vision` inputs) are checked, stripped of EXIF (GPS
# position, device, time) and downscaled first. Pure Rust decoders.
image = ["dep:graphrt-image", "graphrt-llm/vision-preparer"]
# A scripted model provider (config `scripted_models`): runs agent graphs with no
# network and no key, for app tests, previews and the smoke tests of this repository.
scripted-llm = ["graphrt-llm/mock"]
# What the Android AAR and the Swift package ship: every capability that makes
# sense on a phone. Needs libclang on the build host (see `mobile-js`).
sdk = ["default", "mobile-js", "skills", "learning", "files", "ui", "image", "scripted-llm"]
# Enables the `uniffi-bindgen` binary used to generate Kotlin / Swift bindings.
# `cargo-metadata` lets the generator find this crate's uniffi.toml.
bindgen-cli = ["uniffi/cli", "uniffi/cargo-metadata"]

[dependencies]
graphrt-core = { workspace = true, features = ["yaml", "jinja", "tokio"] }
graphrt-llm = { workspace = true, features = ["openai", "anthropic", "gemini", "bedrock", "typesafe"] }
graphrt-http.workspace = true
graphrt-wasm = { workspace = true, features = ["tokio"] }
graphrt-bundle = { workspace = true, features = ["wasm"] }
graphrt-code = { workspace = true, optional = true, features = ["js", "tokio"] }
graphrt-mcp = { workspace = true, optional = true, features = ["http"] }
# Only to switch on rquickjs' `bindgen` feature (see `mobile-js`); not used directly.
rquickjs = { version = "0.14", optional = true, default-features = false, features = ["bindgen"] }
graphrt-doc = { workspace = true, optional = true, features = ["pdf", "office", "spreadsheet", "epub", "email", "tokio"] }
graphrt-rag = { workspace = true, optional = true, features = ["http", "qdrant", "fs", "sqlite", "yaml"] }
graphrt-skill = { workspace = true, optional = true }
graphrt-learn = { workspace = true, optional = true }
graphrt-files = { workspace = true, optional = true, features = ["tokio", "regex"] }
graphrt-ui = { workspace = true, optional = true }
graphrt-image = { workspace = true, optional = true, features = ["tokio", "process"] }
uniffi = { version = "0.32", default-features = false }
# Async methods of foreign traits (`ToolProvider::call_tool`).
async-trait = "0.1"
thiserror.workspace = true
serde = { workspace = true }
serde_json.workspace = true
indexmap.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync", "macros", "net", "io-util"] }

# UniFFI's proc macros expand to `unsafe` FFI glue in this crate, which the
# workspace-wide `unsafe_code = "forbid"` would reject. Hand-written code in this
# crate contains no `unsafe`; every other lint matches the workspace.
[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
indexing_slicing = "warn"
