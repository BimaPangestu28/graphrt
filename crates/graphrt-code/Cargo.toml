[package]
name = "graphrt-code"
description = "Sandboxed code node (embedded JavaScript, optional remote sandbox) for the graphrt workflow runtime."
readme = "README.md"
documentation = "https://docs.rs/graphrt-code"
homepage = "https://github.com/Graphrt/graphrt"
keywords = ["sandbox", "javascript", "quickjs", "workflow", "agent"]
categories = ["development-tools", "asynchronous"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["js", "tokio"]
# Embedded JavaScript via QuickJS.
js = ["dep:rquickjs"]
# No longer changes behaviour: JavaScript always runs on a dedicated, stack-sized thread.
# Kept so existing `features = ["tokio"]` declarations keep compiling.
tokio = ["dep:tokio", "tokio/rt"]
# HTTP client for a remote sandbox service (e.g. for Python).
remote = ["dep:graphrt-http", "dep:reqwest"]
# Python via a local `python3` subprocess. NOT a security sandbox: trusted code only.
python = ["dep:tokio", "tokio/process", "tokio/io-util", "tokio/time", "tokio/rt"]

[dependencies]
graphrt-core.workspace = true
graphrt-http = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
rquickjs = { version = "0.14", optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
futures = { workspace = true, features = ["executor"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
