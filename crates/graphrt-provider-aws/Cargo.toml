[package]
name = "graphrt-provider-aws"
description = "AWS providers for the graphrt gateway: ECS Fargate (gateway-scheduled tasks) and Lambda (short synchronous runs), with a hand-rolled SigV4 + credential chain (no AWS SDK)."
readme = "README.md"
homepage = "https://github.com/BimaPangestu28/graphrt"
documentation = "https://docs.rs/graphrt-provider-aws"
keywords = ["aws", "ecs", "lambda", "sigv4", "gateway"]
categories = ["api-bindings", "asynchronous"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# SigV4 signing, the credential chain (env -> container endpoint -> STS web
# identity -> IMDSv2), presigned EKS tokens and the signed REST client.
auth-aws = ["dep:sha2", "dep:base64", "dep:reqwest", "dep:rustls", "dep:tokio", "dep:serde", "dep:serde_json", "dep:tracing"]
# ECS Fargate: the gateway schedules one task per replica (RunTask / StopTask / DescribeTasks / ListTasks).
provider-ecs = ["auth-aws"]
# AWS Lambda: short synchronous runs through InvokeWithResponseStream + Lambda Web Adapter.
provider-lambda = ["auth-aws", "dep:futures", "dep:bytes"]
# Deploy-time drivers (`graphrt deploy`), kept out of the gateway's run-time build.
# ECS: RegisterTaskDefinition (secrets as Secrets Manager / SSM references, stopTimeout).
deploy-ecs = ["provider-ecs"]
# Lambda: create/update the image function, publish a version, alias, Function URL (RESPONSE_STREAM).
deploy-lambda = ["provider-lambda"]
deploy = ["deploy-ecs", "deploy-lambda"]

[dependencies]
graphrt-provider-api.workspace = true
sha2 = { version = "0.11", optional = true, default-features = false }
base64 = { version = "0.23", optional = true, default-features = false, features = ["alloc"] }
reqwest = { workspace = true, optional = true, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
tokio = { workspace = true, optional = true, features = ["time", "sync", "fs"] }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
bytes = { version = "1", optional = true }

[dev-dependencies]
graphrt-provider-api = { workspace = true, features = ["conformance"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "net", "sync"] }
# The size probe's baseline links the HTTP stack the gateway already has.
reqwest = { workspace = true, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
futures = { workspace = true }
bytes = "1"
serde_json = { workspace = true }

[lints]
workspace = true
