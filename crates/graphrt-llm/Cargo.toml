[package]
name = "graphrt-llm"
description = "Model providers (OpenAI-compatible, Anthropic, Gemini, AWS Bedrock, TypeSafe Jev) and LLM, classifier, extractor and agent nodes for the graphrt workflow runtime."
readme = "README.md"
documentation = "https://docs.rs/graphrt-llm"
homepage = "https://github.com/Graphrt/graphrt"
keywords = ["llm", "openai", "anthropic", "agent", "gemini"]
categories = ["api-bindings", "asynchronous"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["openai", "anthropic", "typesafe", "mock", "replay"]
# `mock::MockModel`, a scripted model for tests and offline examples (no dependencies).
mock = []
# `kind: replay` providers: record responses to cassette files and replay them
# offline (`replay::ReplayModel`), for deterministic tests and evals.
replay = ["dep:sha2"]
# OpenAI-compatible chat completions (OpenAI, Azure OpenAI, Ollama, vLLM, Groq, OpenRouter, DeepSeek, ...).
openai = ["http"]
# Anthropic Messages API.
anthropic = ["http"]
# Google Gemini API (generateContent).
gemini = ["http"]
# AWS Bedrock Converse API (SigV4 signed).
bedrock = ["http", "dep:sha2"]
# TypeSafe System One decision API (Jev): typed classification / scoring / yes-no questions.
typesafe = ["http"]
# Shared HTTP transport (reqwest + rustls with the ring crypto provider).
http = ["dep:reqwest", "dep:rustls", "dep:tokio"]

[dependencies]
graphrt-core.workspace = true
futures.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
reqwest = { workspace = true, optional = true, features = ["rustls-no-provider", "json", "stream"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
sha2 = { version = "0.11", optional = true, default-features = false }
# Only for credential fetch timeouts (reqwest already runs on Tokio).
tokio = { workspace = true, optional = true, features = ["time", "rt"] }

[dev-dependencies]
graphrt-core = { workspace = true, features = ["tokio", "jinja", "yaml"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }

[lints]
workspace = true
