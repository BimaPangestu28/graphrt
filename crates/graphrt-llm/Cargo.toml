[package]
name = "graphrt-llm"
description = "Model providers (OpenAI-compatible, Anthropic, Gemini, AWS Bedrock, TypeSafe Jev) and LLM, classifier, extractor and agent nodes for the graphrt workflow runtime."
readme = "README.md"
documentation = "https://docs.rs/graphrt-llm"
homepage = "https://github.com/Graphrt/graphrt"
keywords = ["llm", "openai", "anthropic", "agent", "gemini"]
categories = ["api-bindings", "asynchronous"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["openai", "anthropic", "typesafe", "mock", "replay", "tool-files", "vision-preparer"]
# The `files` output of the `agent` node: files that native tools return in their
# structured result (for example what the `files` tools of graphrt-files wrote).
# Plugins and MCP servers cannot return file values, so builds that have no native
# file tools leave this out and keep the agent node exactly as small as it was.
tool-files = []
# Model nodes pass their `vision` images through the host's
# `graphrt_core::file::ImagePreparer` (checked, bounded, stripped of metadata,
# resized). Hosts without a preparer leave this out: the nodes then send the
# files' own URLs, with the code they always had.
vision-preparer = []
# `mock::MockModel`, a scripted model for tests and offline examples (no dependencies).
mock = []
# `kind: replay` providers: record responses to cassette files and replay them
# offline (`replay::ReplayModel`), for deterministic tests and evals.
replay = ["dep:sha2"]
# OpenAI-compatible chat completions (OpenAI, Azure OpenAI, Ollama, vLLM, Groq, OpenRouter, DeepSeek, ...).
openai = ["http"]
# Anthropic Messages API.
anthropic = ["http"]
# Google Gemini API (generateContent).
gemini = ["http"]
# AWS Bedrock Converse API (SigV4 signed).
bedrock = ["http", "dep:sha2"]
# TypeSafe System One decision API (Jev): typed classification / scoring / yes-no questions.
typesafe = ["http"]
# The `skills` field of the `agent` node: installed skills loaded on demand (needs a
# `graphrt_core::skill::Skills` service, for example from graphrt-skill). Off by default:
# without it the node refuses a document that lists skills.
skills = []
# The `learning` field of the `agent` node: approved lessons read into the system prompt
# (needs a `graphrt_core::learning::Lessons` service, for example from graphrt-learn). Off
# by default: without it the node refuses a document that sets `learning`.
learning = []
# The `context_window` setting of the `agent` and `llm` nodes: a conversation that
# outgrows the model's context window is trimmed (old tool results, then the oldest
# turns, optionally with a rolling summary) instead of failing the node. Off by
# default: without it the nodes send every message, as they always did.
context = []
# `long_term_memory` of the `agent` node: the tools `memory/remember`, `memory/recall`
# and `memory/forget` over the host's `graphrt_core::memory::Memories` service, and
# matching notes added to the request when a run starts (docs/memory-design.md).
memory = ["graphrt-core/memory"]
# `long_term_memory.graph`: after a note is saved, a model reads its entities and
# relations into the store's memory graph in the background (memory_graph.rs).
memory-graph = ["memory", "graphrt-core/tokio", "dep:tokio"]
# `subagents` of the `agent` node: listed workflows offered as tools and run as
# child runs of the same run, with their pauses passed on (subagents.rs).
subagents = ["graphrt-core/subagents"]
# `text_model::ChatTextModel`: a chat model as a `graphrt_core::text_model::TextModel`, for
# work outside a run such as drafting a skill. No dependencies.
text-model = []
# Shared HTTP transport (reqwest + rustls with the ring crypto provider).
http = ["dep:reqwest", "dep:rustls", "dep:tokio"]

[dependencies]
graphrt-core.workspace = true
futures.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
reqwest = { workspace = true, optional = true, features = ["rustls-no-provider", "json", "stream"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
sha2 = { version = "0.11", optional = true, default-features = false }
# Only for credential fetch timeouts (reqwest already runs on Tokio).
tokio = { workspace = true, optional = true, features = ["time", "rt"] }

[dev-dependencies]
graphrt-core = { workspace = true, features = ["tokio", "jinja", "yaml"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
graphrt-skill = { workspace = true }
graphrt-learn = { workspace = true }
graphrt-memory = { workspace = true, features = ["graph"] }

# What the context guard costs (docs/benchmarks.md, "Context guard").
[[example]]
name = "context_bench"
required-features = ["context", "mock"]

[lints]
workspace = true

# What a child run of `subagents` costs (docs/benchmarks.md, "Subagents").
[[example]]
name = "subagents_bench"
required-features = ["subagents", "mock"]
