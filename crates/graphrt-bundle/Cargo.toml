[package]
name = "graphrt-bundle"
description = "Portable graphrt bundles: one signed file holding a workflow, its plugins and configs, deployable anywhere."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["wasm"]
# Register bundled WebAssembly plugins into a node registry.
wasm = ["dep:graphrt-wasm"]

[dependencies]
graphrt-core = { workspace = true, features = ["yaml"] }
graphrt-wasm = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
thiserror.workspace = true
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = { version = "0.11", default-features = false }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
getrandom = "0.3"
semver = "1"

[dev-dependencies]
graphrt-core = { workspace = true, features = ["yaml", "jinja", "tokio"] }
tokio = { workspace = true, features = ["rt", "macros", "time"] }
futures.workspace = true

[lints]
workspace = true
