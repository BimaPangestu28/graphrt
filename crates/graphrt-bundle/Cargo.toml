[package]
name = "graphrt-bundle"
description = "Portable graphrt bundles: one signed file holding a workflow, its plugins and configs, deployable anywhere."
readme = "README.md"
documentation = "https://docs.rs/graphrt-bundle"
homepage = "https://github.com/BimaPangestu28/graphrt"
keywords = ["bundle", "deploy", "workflow", "agent", "packaging"]
categories = ["development-tools"]
version.workspace = true
edition.workspace = true
# wasmi 2.0.1 (2.0.0 is yanked) needs Rust 1.86; the rest of the workspace stays on 1.85.
rust-version = "1.86"
license.workspace = true
repository.workspace = true

[features]
default = ["wasm"]
# Register bundled WebAssembly plugins into a node registry.
wasm = ["dep:graphrt-wasm"]

[dependencies]
graphrt-core = { workspace = true, features = ["yaml"] }
graphrt-wasm = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
thiserror.workspace = true
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = { version = "0.11", default-features = false }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
getrandom = "0.3"
semver = "1"

[dev-dependencies]
graphrt-core = { workspace = true, features = ["yaml", "jinja", "tokio"] }
tokio = { workspace = true, features = ["rt", "macros", "time"] }
futures.workspace = true

[lints]
workspace = true
