[workspace]
resolver = "3"
members = [
    "crates/graphrt-core",
    "crates/graphrt-llm",
    "crates/graphrt-http",
    "crates/graphrt-code",
    "crates/graphrt-mcp",
    "crates/graphrt-doc",
    "crates/graphrt-rag",
    "crates/graphrt-plugin",
    "crates/graphrt-plugin-sdk",
    "crates/graphrt-wasm",
    "crates/graphrt-otel",
    "crates/graphrt-bundle",
    "crates/graphrt-eval",
    "crates/graphrt-provider-api",
    "crates/graphrt-provider-aws",
    "crates/graphrt-gateway",
    "crates/graphrt-provider-fly",
    "crates/graphrt-ffi",
    "crates/graphrt-gcp",
    "crates/graphrt-provider-k8s",
    "crates/graphrt-cli",
    "crates/graphrt-provider-azure",
]

[workspace.package]
version = "0.6.2"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/Graphrt/graphrt"
keywords = ["workflow", "agent", "llm", "runtime", "graph"]
categories = ["asynchronous", "development-tools"]

[workspace.dependencies]
graphrt-core = { path = "crates/graphrt-core", version = "0.6.2", default-features = false }
graphrt-llm = { path = "crates/graphrt-llm", version = "0.6.2", default-features = false }
graphrt-http = { path = "crates/graphrt-http", version = "0.6.2", default-features = false }
graphrt-code = { path = "crates/graphrt-code", version = "0.6.2", default-features = false }
graphrt-mcp = { path = "crates/graphrt-mcp", version = "0.6.2", default-features = false }
graphrt-doc = { path = "crates/graphrt-doc", version = "0.6.2", default-features = false }
graphrt-rag = { path = "crates/graphrt-rag", version = "0.6.2", default-features = false }
graphrt-plugin = { path = "crates/graphrt-plugin", version = "0.6.2", default-features = false }
graphrt-plugin-sdk = { path = "crates/graphrt-plugin-sdk", version = "0.6.2", default-features = false }
graphrt-wasm = { path = "crates/graphrt-wasm", version = "0.6.2", default-features = false }
graphrt-otel = { path = "crates/graphrt-otel", version = "0.6.2", default-features = false }
graphrt-bundle = { path = "crates/graphrt-bundle", version = "0.6.2", default-features = false }
graphrt-eval = { path = "crates/graphrt-eval", version = "0.6.2", default-features = false }
graphrt-gateway = { path = "crates/graphrt-gateway", version = "0.6.2", default-features = false }
graphrt-provider-api = { path = "crates/graphrt-provider-api", version = "0.6.2", default-features = false }
graphrt-provider-fly = { path = "crates/graphrt-provider-fly", version = "0.6.2", default-features = false }
graphrt-provider-k8s = { path = "crates/graphrt-provider-k8s", version = "0.6.2", default-features = false }
graphrt-provider-aws = { path = "crates/graphrt-provider-aws", version = "0.6.2", default-features = false }
graphrt-gcp = { path = "crates/graphrt-gcp", version = "0.6.2", default-features = false }
graphrt-provider-azure = { path = "crates/graphrt-provider-azure", version = "0.6.2", default-features = false }

futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
indexmap = { version = "2", features = ["serde"] }
smallvec = "1.13"
minijinja = { version = "3", default-features = false, features = ["builtins", "serde", "json", "fuel", "macros", "multi_template"] }
# Workflows and kubeconfigs are only read: no serializer, no comment retention.
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
tokio = { version = "1", default-features = false }
reqwest = { version = "0.13", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
indexing_slicing = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Smallest practical binary: `cargo build --profile min-size`.
# Unwinding is kept (no `panic = "abort"`) so a panicking node or parser fails
# that node instead of killing a long-running server.
[profile.min-size]
inherits = "release"
opt-level = "z"
